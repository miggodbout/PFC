<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PFC Control">
<link rel="apple-touch-icon" href="../shared/logo.png">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../shared/logo.png">
<title>Tracking — PFC Control</title>
<link rel="stylesheet" href="../shared/theme.css">
</head>
<body>

<header class="hdr">
  <a class="hdr-back press" href="../index.html" aria-label="Go back to the home screen">
    <svg width="12" height="20" viewBox="0 0 12 20" fill="none" aria-hidden="true">
      <path d="M10 2L2 10l8 8" stroke="#DE7452" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  <div class="hdr-titles"><h1 class="hdr-title hdr-title--lg">Buildings</h1></div>
</header>

<main id="screen"></main>

<script src="../shared/common.js"></script>
<script>
/* =====================================================================
   BUILDINGS — every project the crew is tracking
   =====================================================================
   The header reads Buildings because a list of addresses is what is on
   the screen. Tracking is the section this screen lives in. The two are
   allowed to differ, and that was chosen deliberately in 0.1.1.

   The stored list draws first, then a fetch refreshes it behind. There is
   no staleness clock and no timer: a fetch that succeeds makes the copy
   fresh by definition, and the app warns only when a fetch FAILS.
   ===================================================================== */

var screen = document.getElementById('screen');

/*
   Which buildings already read Complete when this session first asked.
   sessionStorage, not localStorage: it must survive walking into a
   building and back, and it must be gone when the app closes. It is not
   one of the four data stores, and nothing syncs it.

   A building already finished at the start of the session is not drawn at
   all. One that goes Complete WHILE you watch stays on screen, greyed,
   until the next app open — which is also when its local copy is dropped,
   so the row is tappable for exactly as long as it is drawn.
*/
var SESSION_KEY = 'pfc.control.v1.session.finished';

var held = Store.list();
var lastList = held ? held.projects : null;

if (lastList) {
  // The stored list is this session's first answer. Seed from it, or every
  // long-finished building would flash up greyed for a second before the
  // fetch lands and takes it away.
  rememberFinished(lastList);
  draw(lastList);
} else {
  screen.innerHTML = loadingHtml('Loading buildings…');
}

mountSyncBar();

/* The install note used to be mounted here as well as on the Hub. It is a
   bottom sheet now — a blocking panel — and one of those in front of the
   building list is in the way of the work. The Hub offers it, and the Hub
   keeps a permanent row that opens it again. See mountInstallSheet(). */

// A held or a queued edit is a mark on a Tracking row, so the list
// redraws whenever the queue changes.
Queue.onChange(function () { if (lastList) draw(lastList); });

refresh();

enablePullToRefresh(function () {
  // Send first, then ask. A pull is the one gesture that means "catch up".
  return Queue.wake().then(refresh, refresh);
});

// Walking to the next building and opening the app again asks for the list
// afresh. A glance and straight back does not.
refetchOnReturn(function () {
  var stored = Store.list();
  return stored ? stored.fetchedAt : 0;
}, refresh);


function refresh() {
  return fetchProjects().then(function (result) {
    if (result.source === 'error') {
      // No stored list and no signal is the only blank case. With a list
      // in hand the screen keeps it, and the sync bar says how old it is.
      if (!lastList) {
        screen.innerHTML = errorHtml(result.reason, result.detail);
        markFresh();          // nothing drew, so there is no copy to date
      } else {
        // Read the store again rather than trusting the copy taken at load.
        // An earlier fetch this session may have refreshed it since.
        var stored = Store.list();
        markStale(stored ? stored.fetchedAt : 0);
        draw(lastList);
      }
      return;
    }
    markFresh();
    lastList = result.projects;
    rememberFinished(result.projects);
    dropFinishedCopies(result.projects);
    draw(result.projects);
  });
}


/* ── WHAT WAS ALREADY FINISHED ────────────────────────────────────── */

/** The set of buildings that already read Complete when the session began. */
function finishedAtStart() {
  try {
    return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
  } catch (e) {
    return null;
  }
}

/** Written once, from the first list answer of the session. */
function rememberFinished(projects) {
  if (finishedAtStart()) return;
  var set = {};
  projects.forEach(function (project) {
    if (projectRollup(project).status === 'complete') set[project.id] = true;
  });
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(set)); } catch (e) {}
}


/**
 * A finished building's copy is dropped, ahead of the ten-copy limit.
 * A building holding an unsent edit is never dropped, finished or not.
 */
function dropFinishedCopies(projects) {
  projects.forEach(function (project) {
    if (projectRollup(project).status !== 'complete') return;
    if (Store.hasJobsFor(project.id)) return;
    if (Store.project(project.id)) Store.dropProject(project.id);
  });
}


/* ── DRAW ─────────────────────────────────────────────────────────── */

/* No stale-note argument. How old the copy is belongs to the sync bar, so
   a redraw from a queue change cannot paint the line away. */
function draw(projects) {
  screen.innerHTML = '<div class="body">' + listHtml(projects) + '</div>';
}


function listHtml(projects) {
  var wasFinished = finishedAtStart() || {};

  var rows = projects.map(function (project) {
    return rowHtml(project, wasFinished);
  }).filter(function (row) { return row !== ''; });

  if (rows.length === 0) return emptyHtml(projects);
  return rows.join('');
}


/**
 * THE FOUR TESTS FOR DRAWING A ROW. First match wins.
 *
 *   1. The phone holds an unsent edit for it  -> a normal row
 *   2. Complete, and already Complete when this session started
 *                                             -> DO NOT DRAW IT
 *   3. Complete, and it went Complete during this session
 *                                             -> a greyed row, FINISHED
 *   4. anything else                          -> a normal row
 */
function rowHtml(project, wasFinished) {
  var roll     = projectRollup(project);
  var jobs     = Store.jobCountFor(project.id);
  var unsent   = jobs.waiting + jobs.held;
  var finished = (roll.status === 'complete');

  if (finished && unsent === 0) {
    if (wasFinished[project.id]) return '';                 // test 2
  }

  var grey = finished && unsent === 0;                      // test 3
  var tag  = grey ? '<span class="tag">FINISHED</span>' : '';

  var marks = marksHtml(roll, jobs.held, jobs.waiting);

  /*
     THE PROGRESS BLOCK: a full-width bar with its own number, and the phase
     split under it in three columns.

     The number is weighted by how long each phase takes, so it reads what
     standing in the building feels like — see barPercent() in common.js.
     The phase split is where the three phases are told apart now that the
     bar is one colour, and it names them the way this building names them,
     out of the local copy when there is one.

     THE UNIT LINE WENT IN 0.2.2. It read "30 of 36 units started · 0 done"
     and it was the third numeric readout on a row that is looked at for
     about a second. See the note where startedText used to be, in
     common.js.
  */
  var copy = Store.project(project.id);

  return '<a class="card row press' + (grey ? ' row--finished' : '') + '" ' +
            'href="building.html?p=' + encodeURIComponent(project.id) + '" ' +
            'aria-label="' + escapeHtml(marksLabel(project.name, roll, jobs.held, jobs.waiting)) + '">' +
           '<span class="row-head">' +
             '<span class="row-main">' +
               '<span class="row-title">' + escapeHtml(project.name) + tag + '</span>' +
               '<span class="row-sub">' + escapeHtml(shapeOf(project)) + '</span>' +
             '</span>' +
             pillHtml(roll) +
             ICON.chevron +
           '</span>' +
           '<span class="meta">' + barHtml(roll, true) +
             '<span class="bar-pct">' + barPercent(roll) + '%</span>' +
           '</span>' +
           phaseLineHtml(roll, copy) +
           marks +
         '</a>';
}


/** "36 units · 3 floors", or just "12 units" when there are no floors. */
function shapeOf(project) {
  var units = project.unitCount + (project.unitCount === 1 ? ' unit' : ' units');
  if (project.mode === 'flat') return units;

  var floors = project.groupCount + (project.groupCount === 1 ? ' floor' : ' floors');
  return units + ' · ' + floors;
}


/**
 * TWO EMPTY MESSAGES, not one.
 *
 * "No buildings yet" is wrong once buildings exist and every one of them
 * has finished — it reads as data loss. The list answer tells the two
 * cases apart by itself: it either came back empty, or came back holding
 * buildings that all read Complete.
 */
function emptyHtml(projects) {
  var allDone = projects.length > 0;

  var title = allDone ? 'Nothing to track' : 'No buildings yet';
  var text  = allDone
    ? 'Every building is finished. Open it in Google Sheets to read one.'
    : 'Create your first building.';

  return '<div class="state">' +
           '<div class="state-title">' + title + '</div>' +
           '<div class="state-text">' + text + '</div>' +
           '<a class="btn btn-primary press" style="max-width:240px" href="../setup/index.html">Set Up Building</a>' +
         '</div>';
}
</script>
</body>
</html>
