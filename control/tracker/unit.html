<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PFC Control">
<link rel="apple-touch-icon" href="../shared/logo.png">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../shared/logo.png">
<title>Unit — PFC Control</title>
<link rel="stylesheet" href="../shared/theme.css">
</head>
<body>

<header class="hdr hdr--tight">
  <a class="hdr-back press" id="back" href="index.html" aria-label="Go back to the building">
    <svg width="12" height="20" viewBox="0 0 12 20" fill="none" aria-hidden="true">
      <path d="M10 2L2 10l8 8" stroke="#DE7452" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  <div class="hdr-titles">
    <!-- Empty on purpose. A blank header for a moment reads as loading.
         The literal word "Unit" read as a label, and then changed. -->
    <h1 class="hdr-title" id="title"></h1>
    <div class="hdr-sub" id="subtitle"></div>
  </div>
  <div class="hdr-spacer"></div>
  <div id="unit-pill"></div>
</header>

<main id="screen"></main>

<script src="../shared/common.js"></script>
<script>
/* =====================================================================
   UNIT — every item, grouped by phase
   =====================================================================
   Drawn from the whole-building copy get-project stored, so a unit opens
   with no signal and with no wait.

   A tap on the status control goes on the queue shelf, paints the screen
   at once, and the drain in common.js sends it. Nothing here calls the
   backend to save.

   WHILE IT IS ON ITS WAY the item carries a small turning ring. When it
   lands, the ring stops and says nothing — a landed edit is not news.

   EVERY ITEM IS ALWAYS DRAWN, whatever its Progress. Complete is a mark on
   a row, never a reason to remove the row — the row is the control you set
   Progress with, so hiding it takes away the only way to correct a
   mis-tap. Do not build a hide-finished-items option.
   ===================================================================== */

var projectId = param('p');
var unitKey   = param('u');
var screen    = document.getElementById('screen');

var copy     = null;   // the whole building
var place    = null;   // { unit, group } inside it
var openMenu = null;   // item key of the open status dropdown

/* Which flag's record list is open. One at a time, keyed by item key, or
   by 'phase:<key>' for the Waiting records that hang on a whole phase.
   A FLAG IS A BUTTON AND ITS RECORDS STAY SHUT UNTIL IT IS TAPPED. Three
   records drawn under every item push the next item ~150px down. */
var openRecs = null;

/* Which Progress option was tapped while it was blocked. The reason line
   only appears after somebody asks for it. */
var blockedTapped = null;

/* Record ids marked Fixed during THIS VISIT to this unit.
   A fixed record leaves Tracker — but not the instant you tap it, or a
   mis-tap is unrecoverable on the phone. It stays in place, struck
   through, with Undo beside it. Leave the unit and it is gone. */
var fixedHere = {};

/* The item whose green card is showing. It asks once, after the last open
   record on an item is fixed, and it never sets Complete by itself. */
var greenFor = null;

/* True once the phone has refused to store an edit. It stays up until the
   next tap succeeds, because the person has to be told BEFORE they walk
   away thinking the change is saved. */
var storageRefused = false;


document.getElementById('back').href = 'building.html?p=' + encodeURIComponent(projectId);

if (!projectId || !unitKey) {
  screen.innerHTML = errorHtml('server', 'No unit was given. Go back and choose one.');
} else {
  copy = Store.project(projectId);

  if (copy) {
    render();
  } else {
    setTitle(unitKey);
    screen.innerHTML = loadingHtml('Loading unit…');
  }

  mountSyncBar();

  // RE-READ THE COPY, DO NOT JUST REDRAW. When an edit lands, the drain
  // writes the value into the STORED copy and takes the job off the shelf.
  // This screen is holding its own object from before that, so redrawing it
  // alone would lose the paint and snap the row back to the value the tap
  // replaced — which is the whole defect the fold exists to fix.
  Queue.onChange(function () {
    if (!copy) return;
    copy = Store.project(projectId) || copy;
    render();
  });

  refresh();
  enablePullToRefresh(refresh);
}


/** The queue job for one item on this unit, or null. */
function jobFor(itemKey) {
  return Store.job(itemJobKey(projectId, unitKey, itemKey));
}


function refresh() {
  return fetchProject(projectId).then(function (result) {
    if (result.source === 'error') {
      if (!copy) {
        screen.innerHTML = (result.reason === 'offline' || result.reason === 'timeout')
          ? noCopyHtml()
          : errorHtml(result.reason, result.detail);
        markFresh();          // nothing drew, so there is no copy to date
      } else {
        // The age of the copy goes on the sync bar, not into this draw.
        markStale(Store.projectFetchedAt(projectId));
        render();
      }
      return;
    }
    markFresh();
    copy = result.data;
    render();
  });
}


/* ── DRAW ─────────────────────────────────────────────────────────── */

function render() {
  place = findUnit(copy, unitKey);

  if (!place) {
    screen.innerHTML = errorHtml('server',
      'Unit ' + unitKey + ' is not in this building any more. Go back and choose one.');
    return;
  }

  setTitle(place.unit.label);
  document.getElementById('subtitle').textContent =
    copy.name + (place.group.label ? ' · ' + place.group.label : '');

  // The verdict, and the bar under it. Both, not one: the bar says how far
  // along the unit is, the pill says what it READS — and those differ when
  // an open issue holds a finished unit at In Progress. A full bar beside
  // In Progress is the only sign of that on this screen.
  //
  // The bar is per unit and nothing else. An item is one row with one
  // status; a bar on it would only ever be empty or full.
  var headRoll = unitRollup(copy, unitKey);
  document.getElementById('unit-pill').innerHTML =
    pillHtml(headRoll, 'md') + barHtml(headRoll);

  screen.innerHTML =
    '<div class="body body--flush">' +
      (storageRefused ? storageFullHtml() : '') +
      copy.phases.map(phaseHtml).join('') +
    '</div>';

  placeOpenMenu();
}


function setTitle(label) {
  document.title = 'Unit ' + label + ' — PFC Control';
  document.getElementById('title').textContent = 'Unit ' + label;
}


function phaseHtml(phase) {
  if (phase.items.length === 0) return '';

  var statuses = phase.items.map(function (item) {
    return itemStatus(copy, unitKey, item.key);
  });
  var flags = countFlags(copy, { unit: unitKey, phase: phase.key });

  // A WAITING RECORD CAN HANG ON A WHOLE PHASE, with no item under it.
  // "Phase 2 is waiting on the painters" is not about any one item, so it
  // sits on the phase header — behind a tap, like every other flag. It is
  // the flag that would cost the most height if it opened by itself: it
  // sits above seven items.
  var scope   = 'phase:' + phase.key;
  var onPhase = openRecords(copy, { unit: unitKey, phase: phase.key, item: '' });
  var shown   = withFixedHere(onPhase, { unit: unitKey, phase: phase.key, item: '' });

  var marks = shown.length
    ? '<div class="flag-row">' + flagButton(scope, 'waiting', onPhase.length) + '</div>'
    : '';

  return '<section class="phase">' +
           '<div class="phase-head">' +
             '<h2 class="phase-label">' + escapeHtml(phase.label) + '</h2>' +
             marks +
             pillHtml(rollupOf(statuses, flags), 'xs') +
           '</div>' +
           (openRecs === scope ? recordsHtml(shown, onPhase, scope) : '') +
           phase.items.map(itemHtml).join('') +
         '</section>';
}


/**
 * One flag chip, as a button that opens the records under it.
 *
 * The count on the chip is the OPEN count. A record fixed a moment ago is
 * still drawn in the list under it, but it is not a problem any more and
 * it must not be counted as one.
 */
function flagButton(scope, kind, count) {
  var open = (openRecs === scope);

  return '<button type="button" class="flag-btn press" ' +
                 'aria-expanded="' + open + '" ' +
                 'onclick="toggleRecs(event,' + attr(scope) + ')">' +
           flagChipHtml(kind, count) +
         '</button>';
}


/**
 * The open records, plus any this visit has just fixed.
 *
 * The fixed ones are read back out of the copy by id, so the line they
 * show is the line the Sheet now holds.
 */
function withFixedHere(open, filter) {
  var out  = open.slice();
  var seen = {};
  out.forEach(function (record) { seen[record.record_id] = true; });

  Object.keys(fixedHere).forEach(function (id) {
    if (seen[id]) return;
    var record = recordById(copy, id);
    if (!record) return;
    if (filter.unit  !== undefined && record.unit  !== filter.unit)  return;
    if (filter.phase !== undefined && record.phase !== filter.phase) return;
    if (filter.item  !== undefined && record.item  !== filter.item)  return;
    out.push(record);
  });

  return out;
}


/**
 * The record list under one flag.
 *
 * A row reads   Bypass · 32 6 RH  x1  [ Fixed ]
 *
 * Fix all appears only above MORE THAN ONE open record. One record does
 * not need a bulk button, and the button would then sit on every flag in
 * the app.
 */
function recordsHtml(shown, open, scope) {
  var all = shown.map(function (record) { return recordHtml(record, scope); }).join('');

  var bulk = (open.length > 1)
    ? '<button type="button" class="btn btn-small btn-ghost press fix-all" ' +
              'onclick="fixAll(event,' + attr(scope) + ')">Fix all ' + open.length + '</button>'
    : '';

  return '<div class="recs">' + bulk + all + '</div>';
}


function recordHtml(record, scope) {
  var gone = (record.state !== 'Open');

  // The reason only prints when there is no needed line to print instead.
  // A door size says more than "Wrong Size" does, and both together push
  // the row onto two lines.
  var reason = (record.reason === 'Other' && record.other_text)
    ? record.other_text
    : record.reason;

  var parts = [];
  if (record.subtype) parts.push(escapeHtml(record.subtype));
  parts.push(escapeHtml(record.needed || reason || 'No line'));

  var act = gone
    ? '<span class="rec-done">Fixed</span>' +
      '<button type="button" class="btn btn-small btn-ghost press" ' +
              'onclick="undoFix(event,' + attr(record.record_id) + ',' + attr(scope) + ')">Undo</button>'
    : '<button type="button" class="btn btn-small btn-ghost press" ' +
              'onclick="fixRecord(event,' + attr(record.record_id) + ',' + attr(scope) + ')">Fixed</button>';

  return '<div class="rec' + (gone ? ' rec--fixed' : '') + '">' +
           '<span class="rec-line">' + parts.join(' <span class="rec-sub">·</span> ') + '</span>' +
           '<span class="rec-qty">x' + (record.quantity || 1) + '</span>' +
           '<span class="rec-acts">' + act + '</span>' +
         '</div>';
}


/**
 * One item row, and under it the fix card when its edit failed.
 *
 * COMPLETE IS UNTAPPABLE WHILE AN OPEN FLAG SITS ON THE ITEM. It stays in
 * the list, dimmed, with one line under the panel saying what to do. An
 * item with an open problem is not Complete, and a row that vanishes reads
 * as a broken app.
 */
function itemHtml(item) {
  var key      = itemStatus(copy, unitKey, item.key);
  var menuOpen = (openMenu === item.key);
  var job      = jobFor(item.key);
  var held     = !!(job && job.held);

  var flags   = countFlags(copy, { unit: unitKey, item: item.key });
  var blocked = (flags.deficiency + flags.waiting) > 0;

  var menu = menuOpen ? menuHtml(item, key, blocked) : '';

  // One mark, never two: the ring while it is going, the red dot when it
  // has stopped going. The ring only turns while a call is in the air.
  var mark = job ? queuedRingHtml(held) : '';

  // The item's own records. THE ROW STAYS ONE LINE — the flags go on a
  // line under the name, and the records themselves stay shut until a
  // flag is tapped.
  var open  = openRecords(copy, { unit: unitKey, item: item.key });
  var shown = withFixedHere(open, { unit: unitKey, item: item.key });

  var chips = '';
  if (flags.deficiency) chips += flagButton(item.key, 'deficiency', flags.deficiency);
  if (flags.waiting)    chips += flagButton(item.key, 'waiting', flags.waiting);
  // Fix the last record and the chip goes, but the list under it stays
  // open for this visit, holding the struck-through row and its Undo.
  var recs = (openRecs === item.key) ? recordsHtml(shown, open, item.key) : '';

  return '<div class="item' + (held ? ' item--held' : '') + '">' +
           '<div class="item-top">' +
             '<span class="item-name">' + escapeHtml(item.label) + '</span>' +
             mark +
             '<span class="status-wrap">' +
               '<button type="button" class="status-trigger press s-' + key + '" ' +
                       'aria-expanded="' + menuOpen + '" ' +
                       'onclick="toggleMenu(event,' + attr(item.key) + ')">' +
                 '<span class="dot"></span>' +
                 '<span class="txt">' + STATUS[key].label + '</span>' +
                 '<span class="caret' + (menuOpen ? ' open' : '') + '">' + ICON.caretSm + '</span>' +
               '</button>' +
               menu +
             '</span>' +
           '</div>' +
           (chips ? '<div class="flag-row">' + chips + '</div>' : '') +
           recs +
           (greenFor === item.key ? greenCardHtml(item) : '') +
           (held ? fixCardHtml(item, job, key) : '') +
         '</div>';
}


/**
 * THE GREEN CARD. It asks. It never sets Complete by itself.
 *
 * Fixing the last record on an item is the moment the item usually becomes
 * Complete, and walking back into the dropdown for it is a tap the person
 * has already earned. But "usually" is not "always" — the door can be
 * fixed and still not hung — so the app asks and the crew answers.
 */
function greenCardHtml(item) {
  return '<div class="green-card">' +
           '<div class="green-text">Every issue on ' + escapeHtml(item.label) +
             ' is fixed. Set it to Complete?</div>' +
           '<div class="green-acts">' +
             '<button type="button" class="btn btn-small btn-primary press" ' +
                     'onclick="setCompleteFromCard(event,' + attr(item.key) + ')">Set Complete</button>' +
             '<button type="button" class="btn btn-small btn-ghost press" ' +
                     'onclick="closeGreen(event)">Not yet</button>' +
           '</div>' +
         '</div>';
}


/**
 * The Progress dropdown.
 *
 * COMPLETE IS UNTAPPABLE WHILE AN OPEN ISSUE SITS ON THE ITEM, and it
 * KEEPS ITS NORMAL COLOUR. It carries a small red dot instead, and the
 * reason appears only when somebody taps it.
 *
 * The greyed row shipped first and Miguel turned it down: dimmed text
 * reads as broken, and a sentence sitting under the panel before anybody
 * asked a question is a sentence nobody reads. The dot asks to be tapped
 * and the answer arrives at the moment it is wanted.
 */
function menuHtml(item, key, blocked) {
  var options = CYCLE.map(function (option) {
    var off = blocked && option === 'complete';

    return '<button type="button" class="status-opt press s-' + option +
                  (option === key ? ' on' : '') + '" ' +
                  (off ? 'aria-disabled="true" ' : '') +
                  'onclick="' + (off ? 'blockedTap(event,' + attr(item.key) + ')'
                                     : 'chooseStatus(event,' + attr(item.key) + ',\'' + option + '\')') + '">' +
             '<span class="dot"></span>' +
             '<span class="txt">' + STATUS[option].label + '</span>' +
             (off ? '<span class="blocked-dot"></span>' : '') +
           '</button>';
  }).join('');

  // "issue", never "flag". A flag is what the code calls it. The crew
  // calls an open Deficiency or an open Waiting an issue.
  var note = (blocked && blockedTapped === item.key)
    ? '<div class="status-note status-note--tapped">Fix the open issue first. Then Complete comes back.</div>'
    : '';

  return '<div class="status-menu" id="menu-' + escapeHtml(item.key) + '">' +
           options + note +
         '</div>';
}


/**
 * THE RED CARD. Three things and no more: why it failed in plain words,
 * what was lost, and the two ways out.
 *
 * "What was lost" is the important line. The row above has already snapped
 * back to what the Sheet holds, so without this sentence the screen simply
 * shows the old value and never says the tap went nowhere.
 */
function fixCardHtml(item, job, showing) {
  var tapped = STATUS[safeStatus(job.progress)].label;
  var sheet  = STATUS[safeStatus(showing)].label;

  return '<div class="fix-card">' +
           '<div class="fix-why">' + escapeHtml(job.error || 'This edit did not save.') + '</div>' +
           '<div class="fix-lost">You tapped ' + escapeHtml(tapped) +
             '. The Sheet still says ' + escapeHtml(sheet) + '.</div>' +
           '<div class="fix-acts">' +
             '<button type="button" class="btn btn-small btn-ghost press" ' +
                     'onclick="retryEdit(event,' + attr(job.key) + ')">Try again</button>' +
             '<button type="button" class="btn btn-small btn-delete press" ' +
                     'onclick="deleteEdit(event,' + attr(job.key) + ')">Delete</button>' +
           '</div>' +
         '</div>';
}


function retryEdit(event, key) {
  event.stopPropagation();
  Queue.retry(key);
}

/** The only way an edit leaves this phone unsent. A person has to say so. */
function deleteEdit(event, key) {
  event.stopPropagation();
  Queue.drop(key);
}


/** A JavaScript string, made safe to sit inside an HTML attribute. */
function attr(text) {
  return escapeHtml(JSON.stringify(String(text)));
}


/* ── STATUS DROPDOWN ──────────────────────────────────────────────── */

function toggleMenu(event, itemKey) {
  event.stopPropagation();     // keeps the page listener from closing it again
  openMenu = (openMenu === itemKey) ? null : itemKey;
  blockedTapped = null;
  render();
}


/** Somebody tapped Complete while an issue is open. Now the reason shows. */
function blockedTap(event, itemKey) {
  event.stopPropagation();
  blockedTapped = itemKey;
  render();
}


/* ── RECORDS ──────────────────────────────────────────────────────── */

/** Opens one flag's record list, and closes whichever was open. */
function toggleRecs(event, scope) {
  event.stopPropagation();
  openRecs = (openRecs === scope) ? null : scope;
  render();
}


/**
 * Marks one record Fixed.
 *
 * NOTHING MOVES IN THE SHEET. The row keeps its place and gains a state of
 * Fixed and a closed date, so 0.5 can still show it to a supplier and 0.3
 * can still list it. A record is never deleted and never moved.
 *
 * The whole record goes back on the queue, not just the state — a job
 * carries the final value, which is what makes a retry safe.
 */
function fixRecord(event, recordId, scope) {
  event.stopPropagation();
  setRecordState(recordId, 'Fixed');
  fixedHere[recordId] = true;
  askGreen(scope);
  render();
}


/** Puts a fixed record back. The mis-tap answer, and the only one there is. */
function undoFix(event, recordId, scope) {
  event.stopPropagation();
  setRecordState(recordId, 'Open');
  delete fixedHere[recordId];
  greenFor = null;
  render();
}


/** Every open record under one flag, fixed in one tap. */
function fixAll(event, scope) {
  event.stopPropagation();

  recordsUnder(scope).forEach(function (record) {
    setRecordState(record.record_id, 'Fixed');
    fixedHere[record.record_id] = true;
  });

  askGreen(scope);
  render();
}


/** The open records one scope holds — an item key, or 'phase:<key>'. */
function recordsUnder(scope) {
  if (scope.indexOf('phase:') === 0) {
    return openRecords(copy, { unit: unitKey, phase: scope.slice(6), item: '' });
  }
  return openRecords(copy, { unit: unitKey, item: scope });
}


/**
 * Writes one record's state onto the queue.
 *
 * storageRefused is set the same way a status tap sets it: the phone
 * refusing to store an edit is the one failure no retry fixes, so it has
 * to reach the screen before the person walks away.
 */
function setRecordState(recordId, state) {
  var record = recordById(copy, recordId);
  if (!record) return;

  var next = makeRecord(record);
  next.state  = state;
  next.closed = (state === 'Open') ? '' : todayStamp();

  storageRefused = !queueRecord(projectId, next);
  if (!storageRefused) Queue.wake();
}


/**
 * Asks about Complete, but only when the question makes sense.
 *
 * Not on a phase — a phase has no Progress control. Not on an item that
 * already reads Complete. And not while another open record is left.
 */
function askGreen(scope) {
  greenFor = null;
  if (scope.indexOf('phase:') === 0) return;
  if (recordsUnder(scope).length) return;

  var stored = ((copy.status || {})[unitKey] || {})[scope] || 'not_started';
  if (paintedStatus(projectId, unitKey, scope, stored) === 'complete') return;

  greenFor = scope;
}


function setCompleteFromCard(event, itemKey) {
  greenFor = null;
  chooseStatus(event, itemKey, 'complete');
}


function closeGreen(event) {
  event.stopPropagation();
  greenFor = null;
  render();
}


/**
 * Puts the tap on the queue shelf and redraws.
 *
 * The job carries the FINAL VALUE, not a change to apply, and it is keyed
 * by the thing it changes. Tap the same item twice before it sends and the
 * second job replaces the first, so only the last value ever reaches the
 * Sheet.
 *
 * progress holds the SHORT KEY, which is what every screen on this phone
 * works in. The server turns it into the Sheet's label on the way in.
 *
 * The building copy is not touched. The paint happens on the way to the
 * screen, in paintedStatus, which is what makes a fresh fetch unable to
 * overwrite an edit that has not sent.
 *
 * A RETAP ON A HELD EDIT REPLACES IT. tries goes back to zero and held
 * goes back to false, so trying again by hand is never strictly needed —
 * setting the value again is the same thing and it is one tap closer.
 */
function chooseStatus(event, itemKey, status) {
  event.stopPropagation();

  // Closed before the job lands, because putting a job on the shelf
  // redraws the screen and the menu would flash open for a frame.
  openMenu = null;

  // putJob answers false when the phone would not store the edit. Nothing
  // downstream can recover that, so it goes on the screen at once.
  storageRefused = !Store.putJob({
    key:       itemJobKey(projectId, unitKey, itemKey),
    kind:      'item',
    projectId: projectId,
    unitKey:   unitKey,
    itemKey:   itemKey,
    progress:  status,
    at:        Date.now(),
    tries:     0,
    held:      false,
    error:     ''
  });

  render();
  if (!storageRefused) Queue.wake();
}


/** Puts the open dropdown above the trigger when it would run off screen. */
function placeOpenMenu() {
  if (!openMenu) return;
  var menu = document.getElementById('menu-' + openMenu);
  if (!menu) return;

  var box = menu.getBoundingClientRect();
  if (box.bottom > window.innerHeight - 8) menu.classList.add('up');
}


/*
   THE DETAILS BOX IS GONE.

   Every item used to carry a free-text note in a second Sheet column. The
   app never read it back, so a note typed on a computer was invisible on
   every phone. 0.2 removed the Details column from the Sheet, and a
   structured record in the Deficiencies tab replaced the note — it says
   what is wrong, what is needed and how many, and 0.5 can add it up.

   Step 4 put those records on this screen: the flag chips under each item
   name, the list behind a tap on one, and Logging writes them.
*/


/* ── CLOSE ON A TAP OUTSIDE, OR ON ESCAPE ─────────────────────────── */
/*
   The prototype could only close a dropdown by choosing an option. On a
   phone that traps you, so both ways are added here.

   Every control that must stay open stops the tap from reaching this
   listener. See the event.stopPropagation() call in each handler above,
   and on the details box itself.
*/

function closeAll() {
  // The record list is NOT closed here. It was opened on purpose and the
  // person is reading it; the dropdown is the thing that traps you.
  if (openMenu === null && blockedTapped === null) return;
  openMenu = null;
  blockedTapped = null;
  render();
}

document.addEventListener('click', closeAll);

document.addEventListener('keydown', function (event) {
  if (event.key === 'Escape') closeAll();
});


/*
   NOTHING CACHES A ROLLUP HERE ANY MORE.

   0.1 worked this unit's status out on tap and wrote it into the store, so
   the Building screen would agree. Both screens now read the same building
   copy and call the same rollup function, so they cannot disagree, and
   there is nothing to keep in step.
*/
</script>
</body>
</html>
