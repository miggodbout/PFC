<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PFC Control">
<link rel="apple-touch-icon" href="../shared/logo.png">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../shared/logo.png">
<title>Building — PFC Control</title>
<link rel="stylesheet" href="../shared/theme.css">
</head>
<body>

<header class="hdr">
  <a class="hdr-back press" href="index.html" aria-label="Go back to the building list">
    <svg width="12" height="20" viewBox="0 0 12 20" fill="none" aria-hidden="true">
      <path d="M10 2L2 10l8 8" stroke="#DE7452" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  <div class="hdr-titles">
    <!-- Empty on purpose. A blank header for a moment reads as loading.
         The literal word "Building" read as a label, and then changed. -->
    <h1 class="hdr-title" id="title"></h1>
    <div class="hdr-sub" id="subtitle"></div>
  </div>
</header>

<main id="screen"></main>

<script src="../shared/common.js"></script>
<script>
/* =====================================================================
   BUILDING — floors open one at a time, each holding its unit chips
   =====================================================================
   Drawn from the local copy get-project stored, so the screen appears at
   once and works with no signal. A fetch runs behind it and redraws.
   ===================================================================== */

var projectId = param('p');
var screen    = document.getElementById('screen');
var copy      = null;   // the whole building
var rolls     = {};     // every unit's rollup, worked out once per draw

/* Which floor is open. Floor 1 opens by default on every project, so a
   new project never opens fully closed. Tap the open floor to close it. */
var openFloor = 0;


if (!projectId) {
  screen.innerHTML = errorHtml('server', 'No building was given. Go back and choose one.');
} else {
  copy = Store.project(projectId);

  if (copy) {
    render();
  } else {
    // No copy on this phone. The name is still known if the Buildings list
    // is stored, so the header does not have to wait for the fetch.
    setTitle(nameFromList());
    screen.innerHTML = loadingHtml('Loading building…');
  }

  mountSyncBar();

  // RE-READ THE COPY, DO NOT JUST REDRAW. When an edit lands, the drain
  // writes the value into the STORED copy and takes the job off the shelf.
  // This screen is holding its own object from before that, so redrawing it
  // alone would lose the paint and show the value the tap replaced.
  Queue.onChange(function () {
    if (!copy) return;
    copy = Store.project(projectId) || copy;
    render();
  });

  refresh();
  enablePullToRefresh(function () {
    // Send first, then ask. A pull is the one gesture that means "catch up".
    return Queue.wake().then(refresh, refresh);
  });
}


function refresh() {
  return fetchProject(projectId).then(function (result) {
    if (result.source === 'error') {
      if (!copy) {
        // Nothing stored and nothing reachable. Say which of the two it is.
        screen.innerHTML = (result.reason === 'offline' || result.reason === 'timeout')
          ? noCopyHtml()
          : errorHtml(result.reason, result.detail);
      } else {
        render(staleNoteHtml(Store.projectFetchedAt(projectId)));
      }
      return;
    }
    copy = result.data;
    render();
  });
}


/* ── DRAW ─────────────────────────────────────────────────────────── */

function render(note) {
  setTitle(copy.name);
  document.getElementById('subtitle').textContent = shapeOf(copy);

  // Every unit's rollup, worked out once. Each one is needed twice: for
  // its own chip, and inside its floor's total.
  rolls = unitRollups(copy);

  // A flat project has one unnamed group. Show its chips with no floor
  // header, because there is nothing to open or close — so it hides
  // nothing and needs no marks rule of its own.
  var body = (copy.mode === 'flat' && copy.groups.length === 1)
    ? '<div class="card"><div class="floor-body" style="padding-top:14px">' +
        chipsHtml(copy.groups[0]) + '</div></div>'
    : copy.groups.map(floorHtml).join('');

  // A flat project has no header to open, so it has no drawer either.

  screen.innerHTML = '<div class="body">' + (note || '') + body + '</div>';
}


function setTitle(name) {
  if (!name) return;
  document.title = name + ' — PFC Control';
  document.getElementById('title').textContent = name;
}


/** The building's name out of the stored Buildings list, or ''. */
function nameFromList() {
  var list = Store.list();
  var found = '';
  ((list && list.projects) || []).forEach(function (project) {
    if (project.id === projectId) found = project.name;
  });
  return found;
}


/**
 * A HEADER REPORTS WHAT IT HIDES.
 *
 * Closed, it carries the label, the bar, the count, the pill, both flag
 * counts and the not-saved chip. Open, it carries the first four and
 * nothing else — the flagged chips are right there in front of you.
 *
 * The count, the bar and the pill stay either way. You cannot work those
 * out by eye from twelve chips.
 *
 * EVERY FLOOR'S CHIPS ARE ALWAYS IN THE PAGE, closed ones included, and
 * the drawer hides them by growing its row from 0fr to 1fr. That is what
 * lets the open animate. Drawing the chips only when the floor is open
 * meant a brand new element arrived already open, with nothing to move
 * from, and no CSS transition ever played. The marks come off the header
 * the same way, by a CSS rule rather than by leaving them out.
 */
function floorHtml(group, index) {
  var open = (index === openFloor);
  var roll = groupRollup(group, rolls);

  var notSaved = heldEditsIn(group);
  var marks    = marksHtml(roll, notSaved);

  return '<section class="card floor' + (open ? ' open' : '') + '">' +
           '<button type="button" class="floor-head press" aria-expanded="' + open + '" ' +
                   'aria-label="' + escapeHtml(marksLabel(group.label, roll, notSaved)) + '" ' +
                   'onclick="toggleFloor(' + index + ')">' +
             '<span style="flex:1;min-width:0">' +
               '<span class="floor-label" style="display:block">' + escapeHtml(group.label) + '</span>' +
               '<span class="meta">' + barHtml(roll) +
                 '<span class="floor-count">' + escapeHtml(countText(roll, 'unit', 'units')) + '</span>' +
               '</span>' +
               marks +
             '</span>' +
             pillHtml(roll, 'sm') +
             '<span class="caret">' + ICON.caret + '</span>' +
           '</button>' +
           '<div class="floor-drawer">' +
             '<div class="floor-body">' + chipsHtml(group) + '</div>' +
           '</div>' +
         '</section>';
}


/**
 * The chip carries both flag kinds and NO NUMBERS. Tap through for the
 * count. Four marks is the ceiling on a 77px chip, not a target.
 */
function chipsHtml(group) {
  return group.units.map(function (unit) {
    var roll     = rolls[unit.key] || rollup({}, {});
    var notSaved = heldEditsFor(unit.key);

    return '<a class="unit-chip press" ' +
              'href="unit.html?p=' + encodeURIComponent(projectId) +
                   '&u=' + encodeURIComponent(unit.key) + '" ' +
              'aria-label="' + escapeHtml(marksLabel('Unit ' + unit.label, roll, notSaved)) + '">' +
             '<span class="num">' + escapeHtml(unit.chip || unit.label) + '</span>' +
             '<span class="chip-marks">' +
               dotHtml(roll) +
               flagChipHtml('deficiency', roll.deficiency) +
               flagChipHtml('waiting', roll.waiting) +
             '</span>' +
             barHtml(roll) +
             notSavedChipHtml(notSaved) +
           '</a>';
  }).join('');
}


/*
   Only a HELD edit marks anything above the Unit screen. A waiting edit
   paints the value it set and says nothing else — otherwise every tap
   would light up the whole tree on the way down.

   Nothing is ever held until 0.2 step 3 builds the retry and the hold
   rules, so these both read 0 today.
*/

function heldEditsFor(unitKey) {
  var jobs  = Store.jobs();
  var count = 0;
  Object.keys(jobs).forEach(function (key) {
    var job = jobs[key];
    if (job.held && job.projectId === projectId && job.unitKey === unitKey) count += 1;
  });
  return count;
}

function heldEditsIn(group) {
  return group.units.reduce(function (total, unit) {
    return total + heldEditsFor(unit.key);
  }, 0);
}


/**
 * Only one floor stays open. Tapping the open floor closes every floor.
 *
 * IT MOVES A CLASS AND DRAWS NOTHING. Redrawing here would replace the
 * floor element, and a brand new element arrives already in its final
 * state, so no CSS transition would ever play. Every rule that changes
 * with the open state — the drawer height, the caret, the marks line —
 * hangs off .floor.open in theme.css for exactly this reason.
 */
function toggleFloor(index) {
  openFloor = (openFloor === index) ? -1 : index;

  var floors = screen.querySelectorAll('.floor');
  for (var i = 0; i < floors.length; i++) {
    var open = (i === openFloor);
    floors[i].classList.toggle('open', open);
    var head = floors[i].querySelector('.floor-head');
    if (head) head.setAttribute('aria-expanded', open);
  }
}


function shapeOf(project) {
  var units = project.unitCount + (project.unitCount === 1 ? ' unit' : ' units');
  if (project.mode === 'flat') return units;

  var floors = project.groups.length + (project.groups.length === 1 ? ' floor' : ' floors');
  return units + ' · ' + floors;
}
</script>
</body>
</html>
