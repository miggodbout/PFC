<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PFC Control">
<link rel="apple-touch-icon" href="../shared/logo.png">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../shared/logo.png">
<title>Logging — PFC Control</title>
<link rel="stylesheet" href="../shared/theme.css">
</head>
<body>

<header class="hdr hdr--tight">
  <a class="hdr-back press" id="back" href="../index.html" aria-label="Go back to the home screen">
    <svg width="12" height="20" viewBox="0 0 12 20" fill="none" aria-hidden="true">
      <path d="M10 2L2 10l8 8" stroke="#DE7452" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  <div class="hdr-titles">
    <h1 class="hdr-title">Logging</h1>
    <div class="hdr-sub">Record an issue</div>
  </div>
</header>

<main id="screen"></main>

<script src="../shared/common.js"></script>
<script>
/* =====================================================================
   LOGGING — one problem, one thing needed, one save
   =====================================================================
   LOGGING IS A FORM, NOT A SECOND TREE. Walking Building -> Floor -> Unit
   -> Phase -> Item to write down one broken door is seven screens for one
   record. The place is set once at the top and it stays set; only the
   record fields clear after a save.

   LOGGING WRITES RECORDS ONLY. Progress stays in Tracker, and so does
   marking a record Fixed. Eighteen items would otherwise mean eighteen
   runs of this form.

   A SAVE NEVER CALLS THE BACKEND. A save puts a record on the queue shelf
   and the drain in common.js sends it, so a basement with no signal costs
   nothing but a ring on the row.

   IT DOES READ. It used to do neither, and that cost two reports in the
   step 4 round: a building deleted weeks ago still sat in the dropdown,
   and a real unit came back "not in this building" because the copy on the
   phone predated the floor it was on. Logging draws its item, subtype and
   reason lists out of the stored copy, so a stale copy is a wrong form.
   Now it draws the copy at once and refreshes behind it, the same way
   every Tracker screen does.

   THE PHONE REMEMBERS THE BUILDING AND THE PHASE, AND NEVER THE UNIT. A
   building lasts weeks and a phase lasts days; the unit changes every few
   minutes, and a wrong unit writes a real door against the wrong door.

   ALL THREE ARE FIELDS IN THE FORM. They were behind a bottom sheet and a
   "change" button, which hid the two that move most. Building is
   remembered and usually right; Unit and Phase are the ones you are about
   to change, so they sit in front of you.
   ===================================================================== */

var screen = document.getElementById('screen');

/* Where we are. projectId and phaseKey survive the app closing. unitKey
   never does — see the header comment. */
var placeMemory = Store.read('log.place', {}) || {};
var projectId   = placeMemory.projectId || '';
var phaseKey    = placeMemory.phaseKey  || '';
var unitKey     = '';

var copy     = null;    // the building copy, out of localStorage
var projects = [];      // every building this phone holds a copy of

/* The record being written. Type holds for the visit; everything under it
   clears after each save. */
var type      = 'Deficiency';
var itemKey   = '';
var subtype   = '';
var subOther  = '';
var needed    = '';
var quantity  = 1;
var reason    = '';
var reasonOther = '';

/* What this visit has put on the queue, newest last. It is the place a
   typo is caught before the person leaves the room. */
var loggedHere = [];

var unitTyped  = '';      // what is in the unit box, matched or not
var askLine    = null;    // the near-match prompt: { typed, stored }
var savedStrip = false;   // the strip that confirms one save
var storageRefused = false;


/* ── START ────────────────────────────────────────────────────────── */

readProjects();
loadCopy();
render();
mountSyncBar('../tracker/queue.html');
Queue.onChange(render);

refresh();
enablePullToRefresh(function () {
  // Send first, then ask. A pull is the one gesture that means "catch up".
  return Queue.wake().then(refresh, refresh);
});


/**
 * The buildings this screen may log against, out of what is stored.
 *
 * TWO TESTS, NOT ONE. The list answer says which buildings exist; the
 * copies say which ones this phone can draw a form for. A building must
 * pass both — Logging reads its item, subtype and reason lists out of the
 * copy, so one without a copy would draw an empty form.
 *
 * A COPY WITH NO LIST ENTRY IS A GHOST. That is the `ZZ 02 Step 3 Test`
 * report: the building was deleted on the server, the phone kept both its
 * stale list and its copy, and it went on being offered for weeks. It goes
 * as soon as a fetch lands, because the fresh list no longer names it.
 */
function readProjects() {
  var all = (Store.list() || {}).projects || [];
  var withCopies = Store.projectIds();

  projects = all.filter(function (project) {
    return withCopies.indexOf(project.id) >= 0;
  });

  if (projectId && !listed(projectId)) projectId = '';
  if (!projectId && projects.length === 1) projectId = projects[0].id;
}


function listed(id) {
  var found = false;
  projects.forEach(function (project) { if (project.id === id) found = true; });
  return found;
}


/**
 * Refreshes the list and the open building's copy, behind the drawn form.
 *
 * The form is already on the screen from the stored copy, so nothing here
 * blocks a person from logging. With no signal both calls fail, the age of
 * the copy goes on the sync bar, and the form carries on working.
 */
function refresh() {
  return fetchProjects().then(function (result) {
    if (result.source !== 'error') {
      readProjects();
      loadCopy();
      render();
    }
    // No building chosen means no copy, and no copy cannot be stale. The
    // stale line on the sync bar is about the age of a copy on screen.
    if (!projectId) return;

    return fetchProject(projectId).then(function (got) {
      if (got.source === 'error') {
        markStale(Store.projectFetchedAt(projectId));
        return;
      }
      markFresh();
      loadCopy();
      render();
    });
  });
}


function loadCopy() {
  copy = projectId ? Store.project(projectId) : null;
  if (!copy) { phaseKey = ''; unitKey = ''; return; }

  // A phase the building does not hold is not a phase. It can happen when
  // the remembered building changes, and it can happen when a refresh
  // brings back a building somebody restructured.
  var found = false;
  (copy.phases || []).forEach(function (phase) { if (phase.key === phaseKey) found = true; });
  if (!found) phaseKey = (copy.phases && copy.phases[0]) ? copy.phases[0].key : '';

  // The unit is held as typed text, so a fresh copy re-matches it. A unit
  // added on the server this morning starts matching without a retype.
  matchTypedUnit();
}


function rememberPlace() {
  // The unit is deliberately not written. See the header comment.
  Store.write('log.place', { projectId: projectId, phaseKey: phaseKey });
}


/* ── DRAW ─────────────────────────────────────────────────────────── */

/**
 * Redraws the screen, and puts the keyboard back where it was.
 *
 * A queue drain can finish at any moment, and it redraws this screen
 * through Queue.onChange. Without this the Needed box loses focus
 * mid-word and the keyboard drops on a phone — which, standing in a unit
 * with gloves on, reads as the app throwing the line away.
 */
function render() {
  var focused = document.activeElement;
  var isBox   = !!(focused && focused.tagName === 'INPUT' && focused.id);
  var id      = isBox ? focused.id : '';
  var caret   = 0;

  if (isBox) { try { caret = focused.selectionStart; } catch (e) {} }

  draw();

  if (id) {
    var box = document.getElementById(id);
    if (box) {
      box.focus();
      try { box.setSelectionRange(caret, caret); } catch (e) {}
    }
  }
}


function draw() {
  if (!projects.length) {
    screen.innerHTML =
      '<div class="body">' +
        '<div class="state">' +
          '<div class="state-title">No building on this phone</div>' +
          '<div class="state-text">Open a building in Tracking once. Then you can log against it here, with or without signal.</div>' +
          '<a class="btn btn-primary press" href="../tracker/index.html">Go to Tracking</a>' +
        '</div>' +
      '</div>';
    return;
  }

  var ready   = !!(copy && unitKey);
  var missing = missingLine();

  screen.innerHTML =
    '<div class="body">' +
      (savedStrip ? '<div class="saved-strip">Saved · waiting to send</div>' : '') +
      (storageRefused ? storageFullHtml() : '') +
      '<div class="log-form">' + placeFieldsHtml() + '</div>' +
      (askLine ? askCardHtml() : '') +
      '<div class="log-form log-form--rec' + (ready ? '' : ' log-form--off') + '">' +
        typeFieldHtml() +
        itemFieldHtml() +
        subtypeFieldHtml() +
        neededFieldHtml() +
        countFieldHtml() +
        reasonFieldHtml() +
      '</div>' +
      loggedHtml() +
      '<div class="save-space"></div>' +
    '</div>' +
    '<div class="save-bar" id="save-bar">' +
      (missing ? '<div class="save-note">' + escapeHtml(missing) + '</div>' : '') +
      '<button type="button" class="btn btn-primary press" ' +
              (missing ? 'disabled ' : '') + 'onclick="save()">Save</button>' +
    '</div>';
}


/**
 * BUILDING, UNIT AND PHASE, AT THE TOP OF THE FORM.
 *
 * They were a two-line bar and a bottom sheet. The bar read well and the
 * sheet cost a tap to open, a tap to close, and it hid the two fields that
 * change most: you walk from 301 to 302 far more often than you change
 * building.
 *
 * BUILDING IS A DROPDOWN AND IS REMEMBERED. UNIT IS A BOX AND IS NEVER
 * REMEMBERED — a remembered unit writes a real door against the wrong
 * door. The note under the box is what tells you the number matched.
 */
function placeFieldsHtml() {
  var buildings = option('', 'Choose a building', projectId === '') +
    projects.map(function (project) {
      return option(project.id, project.name, project.id === projectId);
    }).join('');

  var phases = copy ? (copy.phases || []).map(function (phase) {
    return option(phase.key, phase.label, phase.key === phaseKey);
  }).join('') : '';

  return '<div class="field">' +
           '<div class="field-label">Building</div>' +
           '<select class="input input--sm" onchange="setProject(this.value)">' + buildings + '</select>' +
         '</div>' +

         '<div class="field">' +
           '<div class="field-label">Unit</div>' +
           '<input class="input input--sm" id="unit-box" type="text" inputmode="text" ' +
                  'autocomplete="off" placeholder="204" ' +
                  'value="' + escapeHtml(unitTyped) + '" oninput="typeUnit(this.value)">' +
           '<div class="field-note" id="unit-note">' + unitNote() + '</div>' +
         '</div>' +

         '<div class="field">' +
           '<div class="field-label">Phase</div>' +
           '<select class="input input--sm"' + (copy ? '' : ' disabled') +
                  ' onchange="setPhase(this.value)">' + phases + '</select>' +
         '</div>';
}


function phaseLabel() {
  var label = '';
  (copy.phases || []).forEach(function (phase) {
    if (phase.key === phaseKey) label = phase.label;
  });
  return label;
}


/**
 * The phase label with a tag after the dash dropped, if it has one.
 *
 * A label is now just `Phase 1`, so this usually returns what it was
 * given and the row reads `Whole phase — Phase 1`.
 *
 * IT STAYS FOR THE OLD BUILDINGS. A building created before 2026-08-09
 * holds `Phase 1 — Doors & Windows` until somebody renames the phase,
 * and `Whole phase — ` in front of that reads with two dashes, the second
 * of which says nothing.
 */
function phaseName() {
  var label = phaseLabel();
  var match = label.match(/^\s*Phase\s*\d+\s*[—–-]\s*(.+)$/i);
  return match ? match[1] : label;
}


/**
 * ISSUE SITS ABOVE EVERYTHING because the two reason lists share no value.
 * It holds for the visit: four backordered locksets in one room cost one
 * tap, not four.
 *
 * The code calls this `type`; the screen reads `Issue`. Deficiency and
 * Waiting are the two kinds of issue, and `issue` is the settled umbrella
 * word in crew-words.md. The label moved so `Type` was free for the field
 * below, whose own placeholder already read "Choose a type".
 */
function typeFieldHtml() {
  return '<div class="field">' +
           '<div class="field-label">Issue</div>' +
           '<div class="seg">' +
             typeButton('Deficiency') +
             typeButton('Waiting') +
           '</div>' +
         '</div>';
}

function typeButton(value) {
  return '<button type="button" class="press" aria-pressed="' + (type === value) + '" ' +
                 'onclick="setType(\'' + value + '\')">' + value + '</button>';
}


/**
 * WHEN TYPE IS WAITING, THE FIRST ROW IS THE WHOLE PHASE.
 *
 * "Phase 2 is waiting on the painters" is not about any one item. There is
 * no separate "attaches to" control — the item list carries the choice.
 */
function itemFieldHtml() {
  var options = '';

  if (type === 'Waiting') {
    options += option('', 'Whole phase — ' + phaseName(), itemKey === '');
  } else {
    options += option('', 'Choose an item', itemKey === '');
  }

  items().forEach(function (item) {
    options += option(item.key, item.label, itemKey === item.key);
  });

  return '<div class="field">' +
           '<div class="field-label">Item</div>' +
           '<select class="input input--sm" onchange="setItem(this.value)">' + options + '</select>' +
         '</div>';
}


/** The items the chosen phase holds. Never a list written in code. */
function items() {
  var out = [];
  if (!copy) return out;
  (copy.phases || []).forEach(function (phase) {
    if (phase.key === phaseKey) out = phase.items || [];
  });
  return out;
}


function currentItem() {
  var found = null;
  items().forEach(function (item) { if (item.key === itemKey) found = item; });
  return found;
}


/**
 * SUBTYPE IS DRAWN ONLY ON AN ITEM THAT DEFINES TYPES. Four do today:
 * Interior Doors, Exterior Doors, Handles and Stops. Every list ends with
 * Other, which opens a text box, and the typed word goes in this record's
 * subtype cell alone. It never joins the list.
 *
 * The code calls this `subtype`; the screen reads `Type`. The stored list
 * was always `item.types` and the placeholder always said "Choose a type",
 * so the label is what was out of step, not the code.
 */
function subtypeFieldHtml() {
  var item = currentItem();
  if (!item || !(item.types || []).length) return '';

  var options = option('', 'Choose a type', subtype === '');
  item.types.forEach(function (value) {
    options += option(value, value, subtype === value);
  });
  options += option('Other', 'Other', subtype === 'Other');

  var box = (subtype === 'Other')
    ? '<input class="input input--sm" type="text" placeholder="Type it" ' +
             'value="' + escapeHtml(subOther) + '" oninput="typeSubOther(this.value)">'
    : '';

  return '<div class="field">' +
           '<div class="field-label">Type</div>' +
           '<select class="input input--sm" onchange="setSubtype(this.value)">' + options + '</select>' +
           box +
         '</div>';
}


/**
 * NEEDED IS THE HERO FIELD, and the only one at full height. Miguel's
 * words: "the important part is what replacement is needed."
 *
 * Its placeholder is the item's own hint, inside the empty box. The three
 * chips sit under it and filter as you type.
 */
function neededFieldHtml() {
  var item = currentItem();
  var hint = (item && item.hint) ? item.hint : 'What is needed';

  var chips = chipRowHtml();

  return '<div class="field">' +
           '<div class="field-label">Needed</div>' +
           '<input class="input needed-box" id="needed" type="text" ' +
                  'placeholder="' + escapeHtml(hint) + '" ' +
                  'value="' + escapeHtml(needed) + '" oninput="typeNeeded(this.value)">' +
           (chips ? '<div class="suggest">' + chips + '</div>' : '') +
         '</div>';
}


/**
 * The suggestion chips, each one a pair: the line, and an x that stops it
 * being offered again.
 *
 * A CHIP IS EARNED, NOT WRITTEN, so a typo saved three times becomes a
 * suggestion and there was no way to take it back. `painters to finish`
 * is Miguel's example. The x hides it on this phone; the records that fed
 * it are not touched.
 *
 * TWO TARGETS IN ONE OUTLINE, not two separate chips. The line is the
 * thing you tap and it keeps the whole width it had; the x is a narrow
 * strip on its end with a divider, so a gloved thumb aiming at the line
 * cannot land on the x.
 */
function chipRowHtml() {
  return chipsFor(currentGroup(), needed).map(function (line) {
    var arg = escapeHtml(JSON.stringify(line));
    return '<span class="suggest-chip">' +
             '<button type="button" class="suggest-use press" ' +
                     'onclick="useChip(' + arg + ')">' + escapeHtml(line) + '</button>' +
             '<button type="button" class="suggest-x press" ' +
                     'aria-label="Do not suggest ' + escapeHtml(line) + ' again" ' +
                     'onclick="dropChip(' + arg + ')">' + ICON.close + '</button>' +
           '</span>';
  }).join('');
}


/** The chip group this record belongs to: Type · item · subtype. */
function currentGroup() {
  var item  = currentItem();
  var types = item ? (item.types || []) : [];
  var value = (subtype === 'Other') ? 'Other' : subtype;

  return chipGroupKey(type, chipScope(itemKey, phaseKey), chipSubtype(value, types));
}


/** Count sits above Reason: the count belongs beside the line it counts. */
function countFieldHtml() {
  return '<div class="field">' +
           '<div class="field-label">Count</div>' +
           '<div class="qty">' +
             '<button type="button" class="qty-btn press" onclick="bump(-1)" aria-label="One fewer">−</button>' +
             '<span class="qty-n">' + quantity + '</span>' +
             '<button type="button" class="qty-btn press" onclick="bump(1)" aria-label="One more">+</button>' +
           '</div>' +
         '</div>';
}


/**
 * THE REASON LIST COMES FROM THE BUILDING, minus this item's trim.
 *
 * The trim is about responsibility, not about the item: the framer hangs
 * the patio door, so Wrong Swing comes off Exterior Doors even though the
 * door plainly swings. A Waiting record uses the fixed list instead, which
 * never varies and lives in common.js.
 */
function reasonFieldHtml() {
  var list = reasonList();

  var options = option('', 'Choose a reason', reason === '');
  list.forEach(function (value) {
    options += option(value, value, reason === value);
  });

  var box = (reason === 'Other')
    ? '<input class="input input--sm" type="text" placeholder="Say what it is" ' +
             'value="' + escapeHtml(reasonOther) + '" oninput="typeReasonOther(this.value)">'
    : '';

  return '<div class="field">' +
           '<div class="field-label">Reason</div>' +
           '<select class="input input--sm" onchange="setReason(this.value)">' + options + '</select>' +
           box +
         '</div>';
}


function reasonList() {
  if (type === 'Waiting') return WAITING_REASONS.slice();

  var all  = (copy && copy.reasons) ? copy.reasons.slice() : DEFAULT_REASONS.slice();
  var item = currentItem();
  var trim = item ? (item.trim || []) : [];

  return all.filter(function (value) { return trim.indexOf(value) < 0; });
}


function option(value, label, on) {
  return '<option value="' + escapeHtml(value) + '"' + (on ? ' selected' : '') + '>' +
           escapeHtml(label) +
         '</option>';
}


/**
 * "Logged here" — every record this visit saved, with its send state and a
 * Cancel button that is always visible.
 *
 * THIS LIST CAN CANCEL A RECORD AND CAN NEVER MARK ONE FIXED. Cancel
 * undoes a typo made ten seconds ago. Fixing is a repair, and a repair
 * belongs to Tracker.
 */
function loggedHtml() {
  if (!loggedHere.length) return '';

  var rows = loggedHere.map(function (entry) {
    var job  = Store.job(recordJobKey(entry.id));
    var gone = entry.cancelled;

    var mark;
    if (gone)            mark = '<span class="rec-done">Cancelled</span>';
    else if (!job)       mark = '<span class="rec-done">✓</span>';
    else if (job.held)   mark = queuedRingHtml(true);
    else if (!navigator.onLine) mark = '<span class="queued-mark">' + ICON.offline + '</span>';
    else                 mark = queuedRingHtml(false);

    var act = gone ? '' :
      '<button type="button" class="btn btn-small btn-ghost press" ' +
              'onclick="cancelLogged(' + escapeHtml(JSON.stringify(entry.id)) + ')">Cancel</button>';

    return '<div class="logged-row' + (gone ? ' logged-row--gone' : '') + '">' +
             '<span class="logged-line">' + escapeHtml(entry.line) + '</span>' +
             '<span class="rec-qty">x' + entry.quantity + '</span>' +
             mark + act +
           '</div>';
  }).join('');

  return '<div class="field">' +
           '<div class="field-label">Logged here</div>' +
           '<div class="logged">' + rows + '</div>' +
         '</div>';
}


/**
 * THE UNIT BOX NEVER ASSUMES THE FIRST DIGIT IS THE FLOOR.
 *
 * Harbour View numbers its units A1 and A2. The local copy already holds
 * the true answer, so the box matches the typed text against the unit
 * labels and prints the floor it found.
 */
function unitNote() {
  if (!copy) return 'Choose a building first.';
  if (!unitTyped) return 'Type the unit number.';

  var found = matchUnit(unitTyped);
  if (!found) return 'No unit ' + escapeHtml(unitTyped) + ' in this building.';

  return found.group.label
    ? escapeHtml(found.unit.label) + ' · ' + escapeHtml(found.group.label)
    : escapeHtml(found.unit.label);
}


function matchUnit(text) {
  var want  = String(text).trim().toLowerCase();
  var found = null;

  (copy.groups || []).forEach(function (group) {
    group.units.forEach(function (unit) {
      if (String(unit.label).toLowerCase() === want) found = { unit: unit, group: group };
    });
  });

  return found;
}


/* ── HANDLERS ─────────────────────────────────────────────────────── */

function setProject(id) {
  projectId = id;
  unitKey   = '';
  unitTyped = '';
  itemKey   = '';
  subtype   = '';
  reason    = '';
  loadCopy();
  rememberPlace();
  render();

  // The copy on the phone may be weeks old. Ask for a fresh one now rather
  // than at the moment somebody types a unit number that will not match.
  if (projectId) fetchProject(projectId).then(function (got) {
    if (got.source === 'error') return;
    loadCopy();
    render();
  });
}


/** Re-reads unitKey from whatever is in the box. */
function matchTypedUnit() {
  var found = (copy && unitTyped) ? matchUnit(unitTyped) : null;
  unitKey = found ? found.unit.key : '';
}


/**
 * A KEYSTROKE IN THE UNIT BOX NEVER REDRAWS THE FORM. The redraw would
 * take the keyboard down mid-number.
 *
 * The unit changes exactly three things on the screen: the note under the
 * box, whether the record fields below are live, and the Save bar. Each
 * one is moved in place.
 */
function typeUnit(text) {
  unitTyped = text;
  matchTypedUnit();

  var note = document.getElementById('unit-note');
  if (note) note.innerHTML = unitNote();

  var form = document.querySelector('.log-form--rec');
  if (form) form.classList.toggle('log-form--off', !(copy && unitKey));

  paintSaveState();
}

function setPhase(key) {
  phaseKey = key;
  itemKey  = '';
  subtype  = '';
  reason   = '';
  rememberPlace();
  render();
}

/** Type resets the fields under it: the two reason lists share no value. */
function setType(value) {
  type    = value;
  itemKey = '';
  subtype = '';
  reason  = '';
  render();
}

function setItem(key) {
  itemKey = key;
  subtype = '';
  reason  = '';
  render();
}

function setSubtype(value) {
  subtype = value;
  if (value !== 'Other') subOther = '';
  render();
}

function setReason(value) {
  reason = value;
  if (value !== 'Other') reasonOther = '';
  render();
}

function typeNeeded(text) {
  needed = text;
  paintSaveState();

  // Redrawing the whole form here would take the keyboard down on every
  // keystroke. Only the chip row moves.
  var row   = document.querySelector('.suggest');
  var chips = chipRowHtml();

  if (row) { row.innerHTML = chips; return; }
  if (chips) render();
}

/* The two Other boxes. They type into a variable and move the Save bar,
   and they never redraw — the keyboard is up while a person uses them. */
function typeSubOther(text)    { subOther    = text; paintSaveState(); }
function typeReasonOther(text) { reasonOther = text; paintSaveState(); }


/**
 * Refreshes the Save bar in place, with no redraw.
 *
 * The Needed box and the two Other boxes cannot call render() on a
 * keystroke: the redraw takes the keyboard down mid-word, which is the
 * whole reason render() puts the caret back. So they move the only two
 * things a keystroke changes — the missing line, and whether Save can be
 * tapped.
 */
function paintSaveState() {
  var bar = document.getElementById('save-bar');
  if (!bar) return;

  var missing = missingLine();
  var button  = bar.querySelector('button');
  var note    = bar.querySelector('.save-note');

  if (button) button.disabled = !!missing;

  if (missing) {
    if (!note) {
      note = document.createElement('div');
      note.className = 'save-note';
      bar.insertBefore(note, bar.firstChild);
    }
    note.textContent = missing;
  } else if (note) {
    bar.removeChild(note);
  }
}


/** Tap a chip and the STORED line is saved, punctuation and all. */
function useChip(line) {
  needed = line;
  render();
}


/**
 * The x on a chip. It stops the line being suggested, on this phone, in
 * this group. It deletes nothing.
 *
 * Only the chip row is redrawn, for the same reason a keystroke does not
 * redraw: the Needed box may well have the keyboard up when somebody
 * clears a chip under it.
 */
function dropChip(line) {
  hideChip(currentGroup(), line);

  var row = document.querySelector('.suggest');
  if (row) row.innerHTML = chipRowHtml();
  else render();
}

function bump(by) {
  quantity = Math.max(1, quantity + by);
  render();
}


/* ── SAVE ─────────────────────────────────────────────────────────── */

/**
 * The one thing the form still needs, in crew words, or ''.
 *
 * SAVE SAYS WHICH FIELD IS MISSING. A dimmed button on its own leaves a
 * person tapping it, getting nothing, and having no way to learn why —
 * which on site reads as an app that has stopped working.
 *
 * It names ONE field, the highest one still empty, so the line is the next
 * thing to do rather than a list to work through. The order matches the
 * form top to bottom.
 *
 * A Waiting record is allowed a blank Item: that is the `Whole phase` row,
 * and it is a real choice. A Deficiency is always about one item. It is
 * also allowed a blank Needed line, for the reason at that test below.
 */
function missingLine() {
  if (!copy)    return 'Choose a building.';
  if (!unitKey) return 'Set the unit.';

  if (type === 'Deficiency' && !itemKey) return 'Choose an item.';

  var item = currentItem();
  if (item && (item.types || []).length && !subtype) return 'Choose a type.';
  if (subtype === 'Other' && !subOther.trim())       return 'Fill in the Type box.';

  // The field the whole screen exists for. A record with no needed line
  // gives the crew nothing to order and makes no chip for the next person.
  //
  // A WAITING RECORD IS EXEMPT, and this is the only field that treats the
  // two kinds differently. A deficiency is always a thing to replace. A
  // Waiting record is often a fact about the schedule and nothing else —
  // "waiting on painters" names no material — so demanding a line would
  // make somebody invent one. Plan section 1.4: optional on a Waiting
  // record. Miguel confirmed it on 2026-08-09.
  if (type === 'Deficiency' && !needed.trim()) return 'Type what is needed.';

  if (!reason) return 'Choose a reason.';
  if (reason === 'Other' && !reasonOther.trim()) return 'Fill in the Reason box.';

  return '';
}


/**
 * THE NEAR-MATCH PROMPT FIRES HERE, ON SAVE, and never while typing.
 *
 * It only ever offers a line the chip row would have offered, because it
 * compares inside the current group. Either button then saves — the
 * question is which spelling to store, not whether to store.
 */
function save() {
  if (missingLine()) return;

  var hit = askLine ? null : nearMatch(currentGroup(), needed);
  if (hit) {
    askLine = { typed: needed, stored: hit };
    render();
    return;
  }

  writeRecord(needed);
}


function askCardHtml() {
  return '<div class="ask-card">' +
           '<div class="ask-text">This phone already has ' +
             '<b>' + escapeHtml(askLine.stored) + '</b>. You typed ' +
             '<b>' + escapeHtml(askLine.typed) + '</b>.</div>' +
           '<div class="ask-acts">' +
             '<button type="button" class="btn btn-small btn-primary press" onclick="useStored()">Use it</button>' +
             '<button type="button" class="btn btn-small btn-ghost press" onclick="keepMine()">Keep mine</button>' +
           '</div>' +
         '</div>';
}

function useStored() { var line = askLine.stored; askLine = null; writeRecord(line); }
function keepMine()  { var line = askLine.typed;  askLine = null; writeRecord(line); }


/**
 * Puts one record on the queue and clears the record fields.
 *
 * AFTER A SAVE, LOGGING STAYS PUT. Building, Unit and Phase stay filled,
 * because four problems in one room means four saves and no walk back
 * through the place. Jumping to Tracker was rejected for the same reason:
 * it confirms the save and puts the person in the wrong place for the
 * next one.
 */
function writeRecord(line) {
  var item = currentItem();

  var record = makeRecord({
    unit:       unitKey,
    phase:      phaseKey,
    item:       itemKey,
    type:       type,
    reason:     reason,
    other_text: (reason === 'Other') ? reasonOther : '',
    subtype:    (subtype === 'Other') ? subOther : subtype,
    needed:     line,
    quantity:   quantity,
    state:      'Open'
  });

  storageRefused = !queueRecord(projectId, record);

  if (!storageRefused) {
    var name = item ? item.label : ('Whole phase — ' + phaseName());
    loggedHere.push({
      id:        record.record_id,
      line:      (record.subtype ? record.subtype + ' · ' : '') + (line || name),
      quantity:  record.quantity,
      cancelled: false
    });

    // Only the record fields clear. Type holds for the visit.
    itemKey = ''; subtype = ''; subOther = '';
    needed  = ''; quantity = 1;
    reason  = ''; reasonOther = '';

    // The strip takes itself off the screen without a redraw. A redraw
    // four seconds later would land in the middle of the next line being
    // typed and take the keyboard down with it.
    savedStrip = true;
    setTimeout(function () {
      savedStrip = false;
      var strip = document.querySelector('.saved-strip');
      if (strip) strip.parentNode.removeChild(strip);
    }, 4000);

    Queue.wake();
  }

  render();
}


/**
 * Cancel, on a row in "Logged here".
 *
 * IT WRITES A CANCELLED RECORD. It does not delete the queued job. A job
 * that timed out may already have reached the Sheet, and the only way to
 * be sure the Sheet ends up Cancelled is to send that word. The record id
 * is the same, so the server overwrites the one row.
 *
 * Cancelled is also how a chip is taken back: a typo enters the chip pool
 * through a record, and cancelling that record takes it straight out.
 */
function cancelLogged(id) {
  var record = null;
  var found  = null;

  loggedHere.forEach(function (entry) { if (entry.id === id) found = entry; });
  if (copy) record = recordById(copy, id);

  if (!record) {
    var job = Store.job(recordJobKey(id));
    record = job ? job.record : null;
  }
  if (!record) return;

  var next = makeRecord(record);
  next.state  = 'Cancelled';
  next.closed = todayStamp();

  storageRefused = !queueRecord(projectId, next);
  if (!storageRefused && found) found.cancelled = true;
  if (!storageRefused) Queue.wake();

  render();
}


/* ── THE PINNED SAVE BAR ──────────────────────────────────────────── */
/*
   The bar is pinned to the bottom of the screen by CSS alone, and the
   form scrolls behind it. There is no JavaScript here any more.

   It used to ride above the iOS software keyboard: a setSaveBarBottom()
   read window.visualViewport on its resize and scroll events and set the
   bar's bottom to whatever the keyboard was covering. Miguel reversed
   that on 2026-08-09. The bar now sits at bottom: 0 and the keyboard
   covers it while a box is focused. Close the keyboard to reach Save.
*/
</script>
</body>
</html>
