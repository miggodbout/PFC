<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PFC Control">
<link rel="apple-touch-icon" href="../shared/logo.png">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../shared/logo.png">
<title>Set Up Building — PFC Control</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  /* Screen-only rules. Anything shared lives in theme.css. */
  .form { padding: 12px 16px calc(48px + var(--btm-safe)); display: flex; flex-direction: column; gap: 22px; }
  .phase-block { display: flex; flex-direction: column; }
  .done {
    padding: 40px 24px calc(40px + var(--btm-safe));
    display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;
  }
  .done-mark {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(76,175,109,0.16);
    display: flex; align-items: center; justify-content: center;
  }
  .done-title { font-size: 19px; font-weight: 700; color: var(--fg-1); }
  .done-text  { font-size: 14px; color: var(--fg-5); line-height: 1.5; }
  .done .btn:first-of-type { margin-top: 8px; }

  /* The "Change a building" block, closed by default. */
  .edit-toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 2px; width: 100%; text-align: left;
    border-top: 1px solid var(--line-card);
    font-size: 15px; font-weight: 700; color: var(--fg-4);
  }
  .edit-body { display: flex; flex-direction: column; gap: 18px; padding-bottom: 8px; }
  .op-card { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .op-title { font-size: 13px; font-weight: 700; color: var(--accent-2); text-transform: uppercase; letter-spacing: 0.3px; }
  .op-msg { font-size: 13px; line-height: 1.45; }
  .op-msg.good { color: var(--good); }
  .op-msg.bad  { color: var(--danger); }

  /* The removal refusal, inside the Remove an item card. It carries a left
     edge in the danger colour so it does not read as another op card. */
  .refusal {
    display: flex; flex-direction: column; gap: 8px;
    margin-top: 4px; padding: 12px;
    border-radius: 10px;
    border-left: 3px solid var(--danger);
    background: rgba(240, 128, 128, 0.07);
  }
  .refusal-line { font-size: 14px; font-weight: 700; color: var(--fg-2); }
  .refusal-note { font-size: 12.5px; color: var(--fg-5); line-height: 1.45; }

  /* The Lists card */
  .list-label {
    font-size: 12.5px; font-weight: 700;
    color: var(--fg-5);
    margin-top: 8px;
  }
  .list-sub {
    display: flex; flex-direction: column; gap: 10px;
    padding-left: 10px;
    border-left: 2px solid var(--accent-2-line);
  }
  /* The add row is indented in the create form, where it sits under a
     checkbox. Here it sits under a label, so the indent comes off. */
  .op-card .add-row { margin: 0; }

  /* A read-only list of values. Add-only, so no value carries an x. */
  .value-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .value-chip {
    font-size: 13px; color: var(--fg-3);
    padding: 5px 9px;
    border-radius: 8px;
    background: var(--accent-chip);
    border: 1px solid var(--accent-chipbd);
  }

  /* The reason trim. Two columns where the width allows it. */
  .trim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .trim-grid .check { min-height: 40px; }
  .trim-grid .check-label { font-size: 14px; }
</style>
</head>
<body>

<header class="hdr">
  <a class="hdr-back press" href="../index.html" aria-label="Go back to the home screen">
    <svg width="12" height="20" viewBox="0 0 12 20" fill="none" aria-hidden="true">
      <path d="M10 2L2 10l8 8" stroke="#DE7452" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  <div class="hdr-titles"><h1 class="hdr-title">Set Up Building</h1></div>
</header>

<main id="screen"></main>

<script src="../shared/common.js"></script>
<script>
/* =====================================================================
   SET UP BUILDING — create a building, and change an existing one
   =====================================================================
   This screen never changes Progress. It only decides which units and
   which items a building has. Progress is changed on the Unit screen.

   The folder is control/setup/ and the card reads Set Up Building. It was
   called Admin during 0.1. Admin is now the name of a ROLE, not a screen.
   ===================================================================== */


/* ── FORM STATE ───────────────────────────────────────────────────── */

/*
 * The new building, as the form has it so far.
 *
 * IMPORTANT: do not rename this to "form".
 * An inline handler such as oninput="draft.name = this.value" looks the name
 * up on the element first. Every input element already has a "form"
 * property, which holds its parent <form> tag, or null. A variable named
 * "form" would therefore be hidden, and every field would silently do
 * nothing.
 */
var draft = {
  name: '',
  mode: 'floors',        // 'floors' or 'flat'
  floorCount: 3,
  unitsPerFloor: 6,
  unitCount: 12,
  ticked: {},            // 'phaseKey|itemLabel' -> true
  other: {},             // phaseKey -> { on, text, items: [] }
  error: '',
  busy: false
};

// Every standard item starts ticked.
DEFAULT_PHASES.forEach(function (phase) {
  phase.items.forEach(function (label) { draft.ticked[phase.key + '|' + label] = true; });
  draft.other[phase.key] = { on: false, text: '', items: [] };
});

var created = null;     // the building, once the server makes it
var screen = document.getElementById('screen');


/* ── DRAW ─────────────────────────────────────────────────────────── */

function render() {
  screen.innerHTML = created ? doneHtml() : formHtml();
}

function formHtml() {
  return '<div class="form">' +

    /* 1. Name */
    '<div class="field">' +
      '<label class="field-label" for="f-name">Building name</label>' +
      '<input class="input" id="f-name" type="text" placeholder="e.g. Elsliger 36-B" ' +
             'value="' + escapeHtml(draft.name) + '" autocomplete="off" ' +
             'oninput="draft.name = this.value">' +
    '</div>' +

    /* 2. Shape */
    '<div class="field">' +
      '<div class="field-label">Building shape</div>' +
      '<div class="seg">' +
        '<button type="button" class="press accent-edge" aria-pressed="' + (draft.mode === 'floors') + '" ' +
                'onclick="setMode(\'floors\')">Floors and units</button>' +
        '<button type="button" class="press" aria-pressed="' + (draft.mode === 'flat') + '" ' +
                'onclick="setMode(\'flat\')">Units only</button>' +
      '</div>' +
      '<div class="field-note">' +
        (draft.mode === 'floors'
          ? 'Unit numbers follow the site convention: floor 1 gives 101, 102, 103.'
          : 'Units are numbered for now. Rename them when you know the addresses.') +
      '</div>' +
    '</div>' +

    /* 3. Counts */
    (draft.mode === 'floors'
      ? '<div class="row-2">' +
          numberField('f-floors', 'Floors', draft.floorCount, 'draft.floorCount = clamp(this.value)') +
          numberField('f-per', 'Units per floor', draft.unitsPerFloor, 'draft.unitsPerFloor = clamp(this.value)') +
        '</div>'
      : numberField('f-count', 'Unit count', draft.unitCount, 'draft.unitCount = clamp(this.value)')) +

    /* 4. Items */
    '<div class="field">' +
      '<div class="field-label">Items to track</div>' +
      DEFAULT_PHASES.map(phaseHtml).join('') +
    '</div>' +

    /* 5. Error and submit */
    (draft.error ? '<div class="form-error">' + escapeHtml(draft.error) + '</div>' : '') +
    '<button type="button" class="btn btn-primary press" id="f-submit" ' +
            (draft.busy ? 'disabled' : '') + ' onclick="submitForm()">' +
      (draft.busy ? 'Creating…' : 'Create building') +
    '</button>' +

    editSectionHtml() +
  '</div>';
}

function numberField(id, label, value, handler) {
  return '<div class="field">' +
    '<label class="field-label" for="' + id + '">' + escapeHtml(label) + '</label>' +
    '<input class="input" id="' + id + '" type="number" min="1" inputmode="numeric" ' +
           'value="' + value + '" oninput="' + handler + '">' +
  '</div>';
}

function phaseHtml(phase) {
  var other = draft.other[phase.key];

  var rows = phase.items.map(function (label) {
    // jsStr gives a quoted JavaScript string. escapeHtml then makes it safe
    // to sit inside an HTML attribute.
    return checkRow(draft.ticked[phase.key + '|' + label], escapeHtml(label),
                    'toggleItem(\'' + phase.key + '\',' + escapeHtml(jsStr(label)) + ')');
  }).join('');

  var otherRow = checkRow(other.on, 'Other', 'toggleOther(\'' + phase.key + '\')');

  var adder = other.on
    ? '<div class="add-row">' +
        '<input class="input input--sm" id="other-' + phase.key + '" type="text" ' +
               'placeholder="Custom item name" autocomplete="off" ' +
               'value="' + escapeHtml(other.text) + '" ' +
               'oninput="draft.other[\'' + phase.key + '\'].text = this.value" ' +
               'onkeydown="if (event.key === \'Enter\') { event.preventDefault(); addOther(\'' + phase.key + '\'); }">' +
        '<button type="button" class="press" onclick="addOther(\'' + phase.key + '\')">Add</button>' +
      '</div>'
    : '';

  var chips = other.items.map(function (name, index) {
    return '<div class="chip">' +
             '<span class="chip-name">' + escapeHtml(name) + '</span>' +
             '<button type="button" class="chip-x press" aria-label="Remove ' + escapeHtml(name) + '" ' +
                     'onclick="removeOther(\'' + phase.key + '\',' + index + ')">' + ICON.close + '</button>' +
           '</div>';
  }).join('');

  return '<div class="phase-block">' +
           '<div class="phase-sub">' + escapeHtml(phase.label) + '</div>' +
           rows + otherRow + adder + chips +
         '</div>';
}

function checkRow(checked, label, handler) {
  return '<button type="button" class="check press" role="checkbox" aria-checked="' + (checked ? 'true' : 'false') + '" ' +
                 'onclick="' + handler + '">' +
           '<span class="check-box">' + ICON.tick + '</span>' +
           '<span class="check-label">' + label + '</span>' +
         '</button>';
}

function doneHtml() {
  return '<div class="done">' +
    '<div class="done-mark">' + ICON.success + '</div>' +
    '<div class="done-title">Building created</div>' +
    '<div class="done-text">' + escapeHtml(created.name) +
      ' is ready to track. All items start as Not Started.</div>' +
    '<a class="btn btn-primary press" href="../tracker/building.html?p=' + encodeURIComponent(created.id) + '">View building</a>' +
    '<button type="button" class="btn btn-ghost press" onclick="startOver()">Create another</button>' +
    (created.url ? '<a href="' + escapeHtml(created.url) + '" target="_blank" rel="noopener" ' +
                   'style="font-size:13.5px">Open in Google Sheets</a>' : '') +
  '</div>';
}


/* ── FORM ACTIONS ─────────────────────────────────────────────────── */

/* Typing into a field updates the state but does not redraw the screen.
   A redraw would close the keyboard on a phone. Only a tap redraws. */

function clamp(value) {
  var n = parseInt(value, 10);
  return (isNaN(n) || n < 1) ? 1 : n;
}

function jsStr(text) { return JSON.stringify(String(text)); }

function setMode(mode) { draft.mode = mode; draft.error = ''; render(); }

function toggleItem(phaseKey, label) {
  var id = phaseKey + '|' + label;
  draft.ticked[id] = !draft.ticked[id];
  draft.error = '';
  render();
}

function toggleOther(phaseKey) {
  var other = draft.other[phaseKey];
  other.on = !other.on;
  render();
  if (other.on) {
    var field = document.getElementById('other-' + phaseKey);
    if (field) field.focus();
  }
}

function addOther(phaseKey) {
  var other = draft.other[phaseKey];
  var name = String(other.text || '').trim();
  if (!name) return;             // nothing typed, do nothing
  other.items.push(name);
  other.text = '';
  draft.error = '';
  render();
  var field = document.getElementById('other-' + phaseKey);
  if (field) field.focus();
}

function removeOther(phaseKey, index) {
  draft.other[phaseKey].items.splice(index, 1);
  render();
}

/** Collects the ticked items, plus any custom items, into the payload.
 *
 *  Each item carries its three lists — the subtype list, the reason trim
 *  and the needed-box hint. They are seeded into the building's _Config on
 *  the server and read back from there afterwards. Nothing downstream
 *  reads a list out of code, so this screen can change one later without a
 *  release.
 *
 *  A custom item gets empty lists: all eight reasons, no subtype dropdown,
 *  no placeholder. */
function collectPhases() {
  return DEFAULT_PHASES.map(function (phase) {
    var items = phase.items
      .filter(function (label) { return draft.ticked[phase.key + '|' + label]; })
      .map(function (label) { return itemPayload(label); });

    var other = draft.other[phase.key];
    if (other.on) {
      other.items.forEach(function (name) { items.push(itemPayload(name)); });

      // Text still sitting in the box counts too. Nobody should lose an
      // item because they did not press Add.
      var pending = String(other.text || '').trim();
      if (pending) items.push(itemPayload(pending));
    }

    return { key: phase.key, label: phase.label, items: items };
  });
}

function itemPayload(label) {
  var lists = defaultItemLists(label);
  return { label: label, types: lists.types, trim: lists.trim, hint: lists.hint };
}

function submitForm() {
  if (draft.busy) return;

  draft.error = '';
  if (!draft.name.trim()) { draft.error = 'Enter a building name.'; return render(); }

  var phases = collectPhases();
  var total = phases.reduce(function (sum, p) { return sum + p.items.length; }, 0);
  if (total === 0) { draft.error = 'Select at least one item to track.'; return render(); }

  draft.busy = true;
  render();

  createProject({
    name: draft.name.trim(),
    mode: draft.mode,
    floorCount: draft.floorCount,
    unitsPerFloor: draft.unitsPerFloor,
    unitCount: draft.unitCount,
    reasons: DEFAULT_REASONS,
    phases: phases
  }).then(function (result) {
    draft.busy = false;
    if (!result.ok) {
      // Offline gets its own sentence here. The shared one talks about a
      // saved copy, and there is no such thing as a saved copy of a
      // building that was never made. Step 3 test round, point 14.
      draft.error = failText(result.reason, result.detail,
                             'The app did not create the building.');
      return render();
    }
    created = result.data;
    render();
  });
}

function startOver() {
  created = null;
  draft.name = '';
  draft.error = '';
  DEFAULT_PHASES.forEach(function (phase) {
    phase.items.forEach(function (label) { draft.ticked[phase.key + '|' + label] = true; });
    draft.other[phase.key] = { on: false, text: '', items: [] };
  });
  draft.mode = 'floors';
  draft.floorCount = 3;
  draft.unitsPerFloor = 6;
  draft.unitCount = 12;
  render();
  window.scrollTo(0, 0);
}


/* ── CHANGE AN EXISTING BUILDING ──────────────────────────────────── */
/* Structure only. Add or remove an item. Add or rename a unit.          */

var edit = {
  open: false,
  loading: false,
  projects: [],
  listError: null,     // { reason, detail } when the building list failed
  projectId: '',
  structure: null,
  message: '',
  good: false,

  // The removal refusal. blocked holds the server's counts; confirm is the
  // second tap, which is the only friction a bulk cancel gets.
  blocked: null,
  confirm: false,

  // The Lists card. listItemKey picks which item the item-level lists show.
  // The trim and the hint are edited as a working copy and sent whole, so a
  // redraw between two ticks cannot lose the first one.
  listItemKey: '',
  trimDraft: [],
  hintDraft: '',
  typeDraft: '',
  reasonDraft: ''
};

function editSectionHtml() {
  var head = '<button type="button" class="edit-toggle press" onclick="toggleEdit()">' +
               '<span>Change a building</span>' +
               '<span class="caret' + (edit.open ? ' open' : '') + '">' + ICON.caret + '</span>' +
             '</button>';

  if (!edit.open) return head;
  if (edit.loading) return head + loadingHtml('Loading buildings…');

  // Every building on the list is a real Sheet. The demo buildings that
  // this used to filter out were deleted in 0.2.
  var choices = edit.projects;

  if (choices.length === 0) {
    // A FAILED LIST AND AN EMPTY LIST ARE NOT THE SAME THING. Both arrive
    // here as no buildings, and saying "there are none yet" over a dead
    // connection tells the person their work is gone. Found in the 0.2 step
    // 3 test round, point 15.
    return head + '<div class="op-card card"><div class="op-msg' +
      (edit.listError ? ' bad' : '') + '">' +
      escapeHtml(edit.listError
        ? failText(edit.listError.reason, edit.listError.detail,
                   'The app can not load the buildings.')
        : (API_URL ? 'There are no buildings yet. Create one above.'
                   : reasonText('not-configured'))) +
      '</div></div>';
  }

  var picker = '<div class="field">' +
    '<label class="field-label" for="e-project">Building</label>' +
    '<select class="input" id="e-project" onchange="pickProject(this.value)">' +
      '<option value="">Choose a building…</option>' +
      choices.map(function (p) {
        return '<option value="' + escapeHtml(p.id) + '"' +
               (p.id === edit.projectId ? ' selected' : '') + '>' + escapeHtml(p.name) + '</option>';
      }).join('') +
    '</select></div>';

  var body = '';
  if (edit.projectId && edit.structure) body = editOpsHtml(edit.structure);
  else if (edit.projectId) body = loadingHtml('Loading structure…');

  var message = edit.message
    ? '<div class="op-msg ' + (edit.good ? 'good' : 'bad') + '">' + escapeHtml(edit.message) + '</div>'
    : '';

  return head + '<div class="edit-body">' + picker + body + message + '</div>';
}

function editOpsHtml(structure) {
  var phaseOptions = structure.phases.map(function (phase) {
    return '<option value="' + escapeHtml(phase.key) + '">' + escapeHtml(phase.label) + '</option>';
  }).join('');

  var itemOptions = [];
  structure.phases.forEach(function (phase) {
    phase.items.forEach(function (item) {
      itemOptions.push('<option value="' + escapeHtml(phase.key + '::' + item.key) + '">' +
                       escapeHtml(item.label) + '</option>');
    });
  });

  var groupOptions = structure.groups.map(function (group) {
    return '<option value="' + escapeHtml(group.key) + '">' + escapeHtml(group.label) + '</option>';
  }).join('');

  var unitOptions = [];
  structure.groups.forEach(function (group) {
    group.units.forEach(function (unit) {
      unitOptions.push('<option value="' + escapeHtml(unit.key) + '">' +
                       escapeHtml(group.label + ' · ' + unit.label) + '</option>');
    });
  });

  return '' +
    /* Add an item */
    '<div class="op-card card">' +
      '<div class="op-title">Add an item</div>' +
      '<select class="input" id="e-add-phase">' + phaseOptions + '</select>' +
      '<input class="input" id="e-add-label" type="text" placeholder="Item name" autocomplete="off">' +
      '<button type="button" class="btn btn-primary btn-small press" onclick="runOp(\'add-item\')">Add item</button>' +
    '</div>' +

    /* Remove an item */
    '<div class="op-card card">' +
      '<div class="op-title">Remove an item</div>' +
      '<div class="field-note">The item loses its Progress column. Every other column keeps its values.</div>' +
      '<select class="input" id="e-remove-item">' + itemOptions.join('') + '</select>' +
      '<button type="button" class="btn btn-ghost btn-small press" onclick="runOp(\'remove-item\')">Remove item</button>' +
      refusalHtml() +
    '</div>' +

    /* Rename an item — the label moves, the key never does. Without this
       card, fixing a typo costs a remove plus an add, and the new item gets
       a new key: every issue logged against the old one is orphaned, and
       its subtypes, its reasons and every unit's Progress go with it. */
    '<div class="op-card card">' +
      '<div class="op-title">Rename an item</div>' +
      '<div class="field-note">The name changes everywhere. Progress and issues stay with the item.</div>' +
      '<select class="input" id="e-rename-item">' + itemOptions.join('') + '</select>' +
      '<input class="input" id="e-rename-item-label" type="text" placeholder="New name" autocomplete="off">' +
      '<button type="button" class="btn btn-primary btn-small press" onclick="runOp(\'rename-item\')">Rename item</button>' +
    '</div>' +

    /* Add a unit */
    '<div class="op-card card">' +
      '<div class="op-title">Add a unit</div>' +
      '<select class="input" id="e-add-group">' + groupOptions + '</select>' +
      '<input class="input" id="e-add-unit" type="text" placeholder="Unit name (leave empty to number it)" autocomplete="off">' +
      '<button type="button" class="btn btn-primary btn-small press" onclick="runOp(\'add-unit\')">Add unit</button>' +
    '</div>' +

    /* Rename a unit */
    '<div class="op-card card">' +
      '<div class="op-title">Rename a unit</div>' +
      '<select class="input" id="e-rename-unit">' + unitOptions.join('') + '</select>' +
      '<input class="input" id="e-rename-label" type="text" placeholder="New name" autocomplete="off">' +
      '<button type="button" class="btn btn-primary btn-small press" onclick="runOp(\'rename-unit\')">Rename unit</button>' +
    '</div>' +

    listsHtml(structure);
}


/* ── THE REMOVAL REFUSAL ──────────────────────────────────────────── */
/*
   An item holding open issues is not removed. The server counts them and
   refuses, and this panel offers the one action that unblocks it.

   IT IS TWO STEPS ON PURPOSE. Cancel all does not remove the item. You
   press Remove item again afterwards, which is why the panel says so. A
   bulk cancel has no Undo, so the confirm below is the only friction there
   is.

   Cancelled, never Fixed. Removing an item says PFC is not doing that work
   on this job. Fixed would say somebody repaired them.
*/
function refusalHtml() {
  var stop = edit.blocked;
  if (!stop) return '';

  var count = stop.records;
  var issue = count === 1 ? 'issue' : 'issues';

  if (edit.confirm) {
    return '<div class="refusal">' +
      '<div class="refusal-line">Cancel ' + count + ' ' + issue + '?</div>' +
      '<div class="refusal-note">This can not be undone.</div>' +
      '<button type="button" class="btn btn-ghost btn-small press" onclick="cancelAll()">' +
        'Yes, cancel ' + count + '</button>' +
      '<button type="button" class="btn btn-ghost btn-small press" onclick="closeConfirm()">Back</button>' +
    '</div>';
  }

  return '<div class="refusal">' +
    '<div class="refusal-line">Can not remove ' + escapeHtml(stop.label) + '.</div>' +
    '<div class="refusal-note">It holds ' + count + ' open ' + issue + ' across ' +
      stop.units + ' ' + (stop.units === 1 ? 'unit' : 'units') + '.</div>' +
    '<button type="button" class="btn btn-ghost btn-small press" onclick="openConfirm()">' +
      'Cancel all ' + count + ' ' + issue + '</button>' +
    '<div class="refusal-note">Then remove the item again.</div>' +
  '</div>';
}


/* ── THE LISTS CARD ───────────────────────────────────────────────── */
/*
   One card, two levels. The building's reason list at the top, then one
   item dropdown serving all three item-level lists below it. Two cards
   would make you pick the item twice to set up one item.

   ADD IS ADD-ONLY. There is no Delete button on a reason or a subtype, and
   there must never be one: a saved issue stores the value as text, so a
   value that stopped existing would leave rows pointing at nothing.

   The trim and the hint are different, and both are freely reversible. A
   trim removes no value from any list — it only decides what one item's
   dropdown offers next time — and the hint is one line of grey text.

   None of this rebuilds the Tracker tab. A list change moves no column.
*/
function listsHtml(structure) {
  var reasons = structure.reasons || [];
  var item    = itemInStructure(structure, edit.listItemKey);

  var itemPicker = '<select class="input" id="e-list-item" onchange="pickListItem(this.value)">' +
      '<option value="">Choose an item…</option>' +
      structure.phases.map(function (phase) {
        return phase.items.map(function (one) {
          return '<option value="' + escapeHtml(one.key) + '"' +
                 (one.key === edit.listItemKey ? ' selected' : '') + '>' +
                 escapeHtml(one.label) + '</option>';
        }).join('');
      }).join('') +
    '</select>';

  return '<div class="op-card card">' +
    '<div class="op-title">Lists</div>' +

    /* The building's reason list */
    '<div class="list-label">Reasons for this building</div>' +
    valueChips(reasons, 'No reasons yet.') +
    '<div class="add-row">' +
      '<input class="input input--sm" id="e-add-reason" type="text" placeholder="New reason" ' +
             'autocomplete="off" value="' + escapeHtml(edit.reasonDraft) + '" ' +
             'oninput="edit.reasonDraft = this.value" ' +
             'onkeydown="if (event.key === \'Enter\') { event.preventDefault(); runOp(\'add-reason\'); }">' +
      '<button type="button" class="press" onclick="runOp(\'add-reason\')">Add</button>' +
    '</div>' +

    /* The item level */
    '<div class="list-label">Item</div>' +
    itemPicker +
    (item ? itemListsHtml(item, reasons) : '') +
  '</div>';
}

function itemListsHtml(item, reasons) {
  var types = item.types || [];

  return '<div class="list-sub">' +

    '<div class="list-label">Types</div>' +
    valueChips(types, 'This item has no types. It shows no Type box.') +
    '<div class="add-row">' +
      '<input class="input input--sm" id="e-add-type" type="text" placeholder="New type" ' +
             'autocomplete="off" value="' + escapeHtml(edit.typeDraft) + '" ' +
             'oninput="edit.typeDraft = this.value" ' +
             'onkeydown="if (event.key === \'Enter\') { event.preventDefault(); runOp(\'add-type\'); }">' +
      '<button type="button" class="press" onclick="runOp(\'add-type\')">Add</button>' +
    '</div>' +

    '<div class="list-label">Reasons for ' + escapeHtml(item.label) + '</div>' +
    '<div class="field-note">Choose the reasons this item offers. ' +
      'A reason you leave out stays on the building list.</div>' +
    '<div class="trim-grid">' +
      reasons.map(function (reason) {
        // Ticked means the item OFFERS it. The trim stores the opposite,
        // because an empty trim is the common case and it offers all eight.
        return checkRow(edit.trimDraft.indexOf(reason) < 0, escapeHtml(reason),
                        'toggleTrim(' + escapeHtml(jsStr(reason)) + ')');
      }).join('') +
    '</div>' +
    '<button type="button" class="btn btn-primary btn-small press" onclick="runOp(\'set-trim\')">' +
      'Save the reasons</button>' +

    /* The screen reads Example; the config key stays `hint`. crew-words.md
       and code-words.md are allowed to differ on one word, the same way
       Project survives in projectId. Renaming the key would need a fallback
       read for every building already on Drive. */
    '<div class="list-label">Example</div>' +
    '<div class="field-note">The grey text inside the empty Needed box.</div>' +
    '<input class="input input--sm" id="e-hint" type="text" placeholder="e.g. Size   Jamb   Swing" ' +
           'autocomplete="off" value="' + escapeHtml(edit.hintDraft) + '" ' +
           'oninput="edit.hintDraft = this.value">' +
    '<button type="button" class="btn btn-primary btn-small press" onclick="runOp(\'set-hint\')">' +
      'Save the example</button>' +
  '</div>';
}

/** A read-only row of values, or one line saying the list is empty. */
function valueChips(values, emptyText) {
  if (!values.length) return '<div class="field-note">' + escapeHtml(emptyText) + '</div>';
  return '<div class="value-chips">' +
    values.map(function (value) {
      return '<span class="value-chip">' + escapeHtml(value) + '</span>';
    }).join('') +
  '</div>';
}

function itemInStructure(structure, itemKey) {
  if (!itemKey) return null;
  var found = null;
  structure.phases.forEach(function (phase) {
    phase.items.forEach(function (one) { if (one.key === itemKey) found = one; });
  });
  return found;
}

function toggleEdit() {
  edit.open = !edit.open;
  edit.message = '';
  if (edit.open && edit.projects.length === 0) {
    edit.loading = true;
    render();
    loadProjects().then(function (result) {
      edit.loading = false;
      applyProjectList(result);
      render();
    });
    return;
  }
  render();
}

/** Files a building-list answer, keeping a failure apart from an empty list. */
function applyProjectList(result) {
  if (result.source === 'error') {
    edit.listError = { reason: result.reason, detail: result.detail };
    return;
  }
  edit.listError = null;
  edit.projects  = result.projects || [];
}

function pickProject(id) {
  edit.projectId = id;
  edit.structure = null;
  edit.message = '';
  clearRefusal();
  edit.listItemKey = '';
  seedListDrafts(null);
  render();
  if (!id) return;

  loadStructure(id).then(function (result) {
    if (result.source === 'error') {
      edit.message = reasonText(result.reason, result.detail);
      edit.good = false;
    } else {
      edit.structure = result.data;
      seedListDrafts(itemInStructure(result.data, edit.listItemKey));
    }
    render();
  });
}


/* ── THE LISTS CARD, ACTIONS ──────────────────────────────────────── */

/* The trim and the hint are edited as a working copy, then sent whole.
   Every tick redraws the card, so reading them off the elements at save
   time would lose whatever the redraw threw away. */
function seedListDrafts(item) {
  edit.trimDraft = item && item.trim ? item.trim.slice() : [];
  edit.hintDraft = item && item.hint ? item.hint : '';
  edit.typeDraft = '';
}

function pickListItem(itemKey) {
  edit.listItemKey = itemKey;
  edit.message = '';
  seedListDrafts(itemInStructure(edit.structure, itemKey));
  render();
}

function toggleTrim(reason) {
  var at = edit.trimDraft.indexOf(reason);
  if (at < 0) edit.trimDraft.push(reason);
  else edit.trimDraft.splice(at, 1);
  render();
}


/* ── THE REMOVAL REFUSAL, ACTIONS ─────────────────────────────────── */

function openConfirm()  { edit.confirm = true;  render(); }
function closeConfirm() { edit.confirm = false; render(); }

function clearRefusal() {
  edit.blocked = null;
  edit.confirm = false;
}

function cancelAll() {
  var stop = edit.blocked;
  if (!stop) return;

  clearRefusal();
  setEditMessage('Working…', true);

  cancelItemRecords(edit.projectId, stop.itemKey).then(function (result) {
    if (!result.ok) return setEditMessage(reasonText(result.reason, result.detail), false);

    var count = (result.data && result.data.cancelled) || 0;
    setEditMessage(count + ' ' + (count === 1 ? 'issue is' : 'issues are') +
                   ' cancelled. Remove the item again.', true);
  });
}


function runOp(op) {
  var payload = { id: edit.projectId, op: op };
  var picked;

  if (op === 'add-item') {
    payload.phaseKey = valueOf('e-add-phase');
    payload.label = valueOf('e-add-label');
    if (!payload.label.trim()) return setEditMessage('Enter an item name.', false);

  } else if (op === 'remove-item') {
    picked = valueOf('e-remove-item').split('::');
    payload.phaseKey = picked[0];
    payload.itemKey = picked[1];
    if (!payload.itemKey) return setEditMessage('Choose an item.', false);

  } else if (op === 'rename-item') {
    picked = valueOf('e-rename-item').split('::');
    payload.itemKey = picked[1];
    payload.label = valueOf('e-rename-item-label');
    if (!payload.itemKey) return setEditMessage('Choose an item.', false);
    if (!payload.label.trim()) return setEditMessage('Enter a new name.', false);

  } else if (op === 'add-unit') {
    payload.groupKey = valueOf('e-add-group');
    payload.label = valueOf('e-add-unit');

  } else if (op === 'rename-unit') {
    payload.unitKey = valueOf('e-rename-unit');
    payload.label = valueOf('e-rename-label');
    if (!payload.label.trim()) return setEditMessage('Enter a new name.', false);

  } else if (op === 'add-reason') {
    payload.value = edit.reasonDraft;
    if (!payload.value.trim()) return setEditMessage('Enter a reason.', false);

  } else if (op === 'add-type' || op === 'set-trim' || op === 'set-hint') {
    payload.itemKey = edit.listItemKey;
    if (!payload.itemKey) return setEditMessage('Choose an item.', false);

    if (op === 'add-type') {
      payload.value = edit.typeDraft;
      if (!payload.value.trim()) return setEditMessage('Enter a type.', false);
    } else if (op === 'set-trim') {
      payload.trim = edit.trimDraft.slice();
    } else {
      payload.value = edit.hintDraft;
    }
  }

  // A new remove attempt starts clean. The old refusal counted records that
  // Cancel all may since have closed.
  if (op === 'remove-item') clearRefusal();

  setEditMessage('Working…', true);

  updateStructure(payload).then(function (result) {
    if (!result.ok) {
      // The server refuses a removal that would orphan open issues, and it
      // sends the two counts with the refusal so this screen can offer the
      // one action that unblocks it.
      var stop = result.data && result.data.blocked;
      if (stop) {
        edit.blocked = stop;
        edit.confirm = false;
        return setEditMessage('', false);
      }
      return setEditMessage(reasonText(result.reason, result.detail), false);
    }

    setEditMessage('Done. The building is updated.', true);
    if (op === 'add-reason') edit.reasonDraft = '';

    // Read the structure back, so the lists show the change.
    loadStructure(edit.projectId).then(function (fresh) {
      if (fresh.source !== 'error') {
        edit.structure = fresh.data;

        // An item that was just removed stops being the Lists card's item.
        var still = itemInStructure(fresh.data, edit.listItemKey);
        if (!still) edit.listItemKey = '';
        seedListDrafts(still);
      }
      render();
    });
  });
}


/**
 * A failure sentence for a screen that holds no saved copy.
 *
 * The shared offline line says the app opened from its saved copy and to
 * try again with signal. That is right on Tracking, which draws a copy.
 * THIS SCREEN ALWAYS ASKS THE SERVER, so there is nothing to fall back to
 * and nothing to see. It says what did not happen instead.
 *
 * Every other reason keeps the shared sentence. Only offline is wrong here.
 */
function failText(reason, detail, what) {
  if (reason === 'offline') return 'No connection. ' + what;
  return reasonText(reason, detail);
}

function setEditMessage(text, good) {
  edit.message = text;
  edit.good = !!good;
  render();
}

function valueOf(id) {
  var field = document.getElementById(id);
  return field ? field.value : '';
}


/* ── START ────────────────────────────────────────────────────────── */

render();

/*
   A pull re-reads the building list and, if one is open for editing, its
   structure. This screen deliberately never draws a stored copy, so a pull
   here is the only way to pick up a building somebody created a minute ago
   without leaving the page.
*/
enablePullToRefresh(function () {
  return loadProjects().then(function (result) {
    applyProjectList(result);
    if (!edit.projectId) { render(); return; }

    return loadStructure(edit.projectId).then(function (fresh) {
      if (fresh.source !== 'error') {
        edit.structure = fresh.data;
        seedListDrafts(itemInStructure(fresh.data, edit.listItemKey));
      }
      render();
    });
  }, function () { render(); });
});
</script>
</body>
</html>
